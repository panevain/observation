# Largest allowed size of each WebAssembly module in dist/, checked after every release build
# by `cargo xtask wasm-budget` (ci.yml's wasm job; locally `mise run build:budget` after
# `mise run build`). Keys are the module names without trunk's content hash.
#
# The limits sit a few percent above the current sizes, so an unplanned jump fails the build
# instead of passing unnoticed. When a change grows the bundle on purpose, raise the limit in
# the same pull request and say why; docs/design.md#bundle-size lists what dominates it.
# Sizes are bytes; gzip is level 9 deflate in gzip framing, measured in process by flate2
# (miniz_oxide), which on real wasm compresses 0.2% to 1.3% larger than zlib at the same level
# (the server sends gzip or brotli to browsers).

[observation-client]
# 26,683,425 raw and 8,020,291 gzip (zlib) on develop at 5a18361 (Bevy 0.20.1). The gzip
# limit was 8,300,000 against zlib's gzip. When the check moved to flate2 it was raised by the
# most the two can differ on this module: for the same release build, flate2 gave 8,091,379
# and zlib 7.69 MiB, which is 8,058,307 to 8,068,792 B (the old check printed MiB to two
# decimals). The difference is 22,587 to 33,072 B, so the limit rose by 33,072, rounded up.
raw = 27_500_000
gzip = 8_334_000

[coverage-worker]
# 48,722 raw and 22,190 gzip (zlib) on develop at 5a18361. The gzip limit was 32,000 against
# zlib's gzip. When the check moved to flate2 it was raised by the most the two can differ on
# this module: 1.334%, the largest difference measured between flate2 and zlib on small real
# wasm files (this module is too small to compare in the old check's MiB output), of its
# flate2 size of 23,420 is 313 B, so the limit rose to 32,313, rounded up.
raw = 64_000
gzip = 32_320

# Crate cooldown, checked on every pull request by scripts/check-cargo-cooldown.py (the
# `cargo-cooldown` check in security.yml; locally `mise -E ci run cooldown`).
#
# A crate version that a pull request adds to Cargo.lock or fuzz/Cargo.lock, directly used or
# pulled in by another crate, must have been on crates.io for at least `days`. This matches
# Dependabot's cooldown (dependabot.yml), which only covers the crate it bumps. A version that
# fixes a RustSec vulnerability its crate has at the base (it is in the advisory's patched
# range) is exempt, as Dependabot's security updates are; other new releases of that crate wait.
days = 7

# Exemptions, each with a reason. `version` limits one to that version (otherwise every
# version of the crate is exempt); `until` (YYYY-MM-DD) ends it, after which the check
# reports it for removal. For example:
#   { name = "some-crate", version = "1.2.4", reason = "fixes #123; reviewed the diff", until = 2026-12-01 },
exempt = []

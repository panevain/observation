[workspace]
resolver = "3"
members = [
    "crates/*",
]
default-members = [
    "crates/observation-core",
    "crates/observation-server",
    "crates/observation-regions",
    "crates/observation-regions-api",
    "crates/observation-upstream",
    "crates/observation-tokens",
    "crates/observation-client-model",
]
# Separate workspaces, each with its own Cargo.lock: the fuzz targets (nightly only; see
# fuzz/README.md) and the repository's tooling (`cargo xtask`, see xtask/Cargo.toml), whose
# dependencies ship in no image and so stay out of this lockfile.
exclude = ["fuzz", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/panevain/observation"
publish = false

[workspace.dependencies]
observation-core = { path = "crates/observation-core" }
observation-upstream = { path = "crates/observation-upstream" }
observation-tokens = { path = "crates/observation-tokens" }
observation-client-model = { path = "crates/observation-client-model" }
observation-regions-api = { path = "crates/observation-regions-api" }

# shared
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
thiserror = "2"
earcut = "0.4"
ron = "0.12"

# server
axum = "0.8"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip", "compression-br", "set-header", "limit", "timeout", "request-id"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# tests (dev-dependencies only)
proptest = { version = "1.12", default-features = false, features = ["std"] }

# client
bevy = { version = "0.20.1", default-features = false } # 0.20.1: ruzstd 0.9.1 (RUSTSEC-2026-0344)
bevy_egui = { version = "0.43", default-features = false }

# Workspace dependencies with no user yet: each arrives with the change that first needs it.
# Remove in sweep (each entry goes once a member uses it). xtask/Cargo.toml has the same list
# for its own workspace.
[workspace.metadata.cargo-shear]
ignored = ["observation-client-model", "observation-regions-api", "proptest"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"

[workspace]
resolver = "3"
members = ["crates/observation-core", "crates/observation-server", "crates/observation-regions", "crates/observation-upstream", "crates/observation-tokens", "crates/observation-client"]
default-members = ["crates/observation-core", "crates/observation-server", "crates/observation-regions", "crates/observation-upstream", "crates/observation-tokens"]
# Fuzz targets are a separate nightly-only workspace (see fuzz/README.md).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-dev.2"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/panevain/observation"
publish = false

[workspace.dependencies]
observation-core = { path = "crates/observation-core" }
observation-upstream = { path = "crates/observation-upstream" }
observation-tokens = { path = "crates/observation-tokens" }

# shared
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
thiserror = "2"
earcut = "0.4"
ron = "0.12"

# server
axum = "0.8"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip", "compression-br", "set-header", "limit", "timeout", "request-id"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# client
bevy = { version = "0.20", default-features = false }
bevy_egui = { version = "0.43", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"

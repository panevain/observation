# Dev tooling and tasks: https://mise.jdx.dev
# CI runs these same tasks (.github/workflows/ci.yml), so `mise run check` matches it. CI loads
# mise.ci.toml on top of this file (MISE_ENV=ci): the tools only CI and the image build use,
# CI's environment, and the tasks behind the security, fuzz and scan steps. `mise -E ci install`
# then `mise -E ci run <task>` runs one of those locally.
# rust-toolchain.toml is the single source of truth for the Rust version, components and
# targets: rustup reads it directly, mise reads it through idiomatic version files (see
# [settings]), and scripts/check-toolchain-sync.sh keeps Cargo.toml and the Dockerfile
# aligned. Without mise, install rustup and run cargo; it fetches the toolchain itself.
# Machine-specific settings (OBS_CONTACT, OBS_BIND) go in mise.local.toml, which is
# gitignored; copy mise.local.toml.example to start. Docker Compose settings are on the
# `up` task below; its tokens are fnox secrets (fnox.toml; values in the gitignored
# fnox.local.toml). The local development stack (`mise run dev`) is in mise.dev.toml, which
# .miserc.toml loads by default.

# hard: the oldest mise that reads this config correctly (2026.7.15 added [task_config] shell;
# an older one would ignore it and run the task scripts under sh). soft: the CI mise version
# (.github/actions/setup-mise, which the Pins workflow bumps along with this value; mise run sync
# checks they agree); an older mise warns.
min_version = { hard = "2026.7.15", soft = "2026.10.18" }

[settings]
# Take the Rust version from rust-toolchain.toml instead of repeating it here. mise.lock still
# needs a [[tools.rust]] entry for that version, because `mise install --locked` (used in CI)
# rejects any resolved tool that is missing from the lock; bump it with the toolchain
# (`mise run lock`).
idiomatic_version_file_enable_tools = ["rust"]
# A new release of any tool is taken once it is a week old, as Dependabot's cooldown does
# (`mise upgrade --bump`, which the Pins workflow runs, and `latest`). Exact pins and
# lockfile entries are not affected.
minimum_release_age = "7d"
# Don't report installs to mise-versions.jdx.dev (download statistics).
use_versions_host_track = false

[task_config]
# Every inline task script in this directory's mise files (mise.ci.toml, mise.dev.toml and your
# gitignored mise.local.toml too) runs under bash with errexit, nounset and pipefail, so the
# scripts need no shebang or `set` line of their own. A task's own `shell` or shebang opts out.
shell = "bash -o errexit -o nounset -o pipefail -c"

[tool_alias]
# The registry's `trunk` is a different tool (Trunk.io's launcher).
trunk = "github:trunk-rs/trunk"
fnox = "github:jdx/fnox"
# Also CI's (mise.ci.toml [tools]); here for the verify and up tasks.
cosign = "aqua:sigstore/cosign"

[tools]
# mise.lock records the release checksums; the Dockerfile installs trunk from it.
trunk = "0.21.14"

[env]
# trunk would otherwise query the crates.io API for a newer release on every build.
TRUNK_SKIP_VERSION_CHECK = "true"

[tasks.fmt]
description = "cargo fmt --check"
run = "cargo fmt --all --check"

[tasks.clippy-native]
description = "Clippy on the native workspace"
run = "cargo clippy --locked --workspace --exclude observation-client --all-targets -- -D warnings"

[tasks.clippy-wasm]
description = "Clippy on the wasm client"
run = "cargo clippy --locked -p observation-client --target wasm32-unknown-unknown --all-targets -- -D warnings"

[tasks.test]
description = "Unit tests (core + server, then client if it has a lib target); uses cargo-nextest when installed (`mise -E ci install cargo-nextest`)"
run = '''
if cargo nextest --version >/dev/null 2>&1; then
  cargo nextest run --locked --workspace --exclude observation-client
  cargo test --locked --doc --workspace --exclude observation-client
else
  cargo test --locked --workspace --exclude observation-client
fi
if [ -f crates/observation-client/src/lib.rs ]; then
  cargo test --locked -p observation-client --lib
else
  echo "observation-client has no library target; skipping."
fi
'''

[tasks.coverage]
description = "Line coverage of core + server (needs cargo-llvm-cov, `mise -E ci install cargo-llvm-cov`, and the llvm-tools-preview component); writes lcov.info"
run = "cargo llvm-cov --locked --workspace --exclude observation-client --lcov --output-path lcov.info"

[tasks.tokens]
description = "Design-token guard (no colour literals outside theme.rs)"
run = "scripts/check-design-tokens.sh"

[tasks.sync]
description = "The Rust and mise versions agree across rust-toolchain.toml, Cargo.toml, mise.lock, the Dockerfile and the workflows, and the advisory ignore lists agree"
run = "scripts/check-toolchain-sync.sh"

[tasks.lock]
description = "Refresh mise.lock and mise.ci.lock (checksums for every platform they list) after changing a tool in mise.toml or mise.ci.toml"
# Under MISE_ENV=ci, `mise lock` writes both: each tool into the lockfile beside the file that
# declares it.
run = "MISE_ENV=ci {{mise_bin | quote}} lock"

[tasks.treemap]
description = "Regenerate docs/images/wasm-bundle-treemap.svg (fat-LTO build, 15-20 minutes)"
run = "scripts/wasm-size-report.sh"

[tasks.build]
description = "Release-build the wasm client into dist/ (as CI does)"
run = "trunk build --release --locked"

[tasks."build:sizes"]
description = "Sizes of dist/*.wasm (raw, gzip -9 and, if brotli is installed, brotli -q 11) as a Markdown table"
# A shebang: mise appends extra arguments to the text of an inline script, which would break
# the closing `done`; a script file gets them as ignored arguments instead.
run = '''
#!/usr/bin/env bash
set -euo pipefail
mib() { awk -v n="$1" 'BEGIN { printf "%.2f MiB", n / 1048576 }'; }
echo "| file | raw | gzip -9 | brotli -q 11 |"
echo "| --- | ---: | ---: | ---: |"
for f in dist/*.wasm; do
  br="n/a"
  if command -v brotli >/dev/null 2>&1; then br="$(mib "$(brotli -q 11 -c "$f" | wc -c)")"; fi
  printf '| `%s` | %s | %s | %s |\n' "$(basename "$f")" "$(mib "$(wc -c < "$f")")" \
    "$(mib "$(gzip -9 -c "$f" | wc -c)")" "${br}"
done
'''

[tasks."build:budget"]
description = "Check dist/*.wasm against .config/wasm-size-budget.toml (after `mise run build`)"
run = 'python3 scripts/check-wasm-size.py ${GITHUB_STEP_SUMMARY:+--summary "${GITHUB_STEP_SUMMARY}"}'

[tasks."test:browser"]
description = "Headless-browser smoke test of the client against a running server (OBS_URL, default http://127.0.0.1:8080; start one with `mise run serve --release`). Needs Node.js and Chrome (or CHROME_PATH)"
dir = "{{config_root}}/tests/browser"
run = [
  "npm ci --ignore-scripts --no-audit --no-fund",
  "node smoke.cjs",
]

[tasks."build:dev"]
description = "Fast unoptimised wasm client build into dist/"
run = "trunk build --locked"

[tasks.serve]
description = "Dev-build the client, then run the server from the repo root (`--release` builds both for release)"
usage = 'flag "--release" help="Release-build the client and the server, as CI does"'
# The client build is a step, not a templated `depends` entry, which `mise tasks validate`
# can't resolve to a task.
run = [
  "trunk build --locked{% if usage.release %} --release{% endif %}",
  "cargo run --locked -p observation-server{% if usage.release %} --release{% endif %}",
]

# The old name for `serve --release`. An alias can't pass the flag, so this is a task.
[tasks."serve:release"]
hide = true
run = [{ task = "serve", args = ["--release"] }]

[tasks.verify]
description = "Check that a published image was signed and attested by Release on its release tag; prints it pinned by digest (scripts/verify-image.sh)"
# A task tool (installed and locked for this task only), at CI's cosign version (mise.ci.toml;
# `mise run sync` checks they agree, and the Pins workflow moves them together).
tools.cosign = "3.1.3"
usage = '''
arg "<image>" help="ghcr.io/panevain/observation or ghcr.io/panevain/observation-regions, with :TAG or @sha256:DIGEST"
arg "[ref]" help="The ref Release must have run on (default: refs/tags/vX.Y.Z for :X.Y.Z, any release tag for :latest)"
'''
run = 'scripts/verify-image.sh "${usage_image}" ${usage_ref:+"${usage_ref}"}'

[tasks.up]
description = "Start the Docker Compose stack (app + region agent) from the released images, checked against their signatures, with the fnox secrets"
# Task tools: installed and locked for this task only, so `mise install` and CI skip them.
tools.fnox = "1.42.1"
tools.cosign = "3.1.3"
usage = 'flag "--build" help="Build both images from this checkout (tagged :local) instead of pulling OBS_VERSION"'
run = '''
if [ "${usage_build:-false}" = true ]; then
  OBS_VERSION=local OBS_IMAGE= OBS_REGIONS_IMAGE= fnox exec -- docker compose up -d --build
else
  # Each image must carry Release's signature and provenance for OBS_VERSION's tag, and runs by
  # the digest that was checked, so a tag moved in between is never pulled. A patch release
  # reaches a running stack with another `mise run up`.
  OBS_IMAGE="$(scripts/verify-image.sh "ghcr.io/panevain/observation:${OBS_VERSION}")"
  OBS_REGIONS_IMAGE="$(scripts/verify-image.sh "ghcr.io/panevain/observation-regions:${OBS_VERSION}")"
  export OBS_IMAGE OBS_REGIONS_IMAGE
  fnox exec -- docker compose up -d --pull missing
fi
'''

# Compose settings, for this task only (so `mise run serve` is unaffected). A variable
# already set wins, e.g. `OBS_PORT=9090 mise run up`.
[tasks.up.env]
# Release to run: `latest`, or a version such as 0.1.0 (both images use the same one).
OBS_VERSION = "{{ get_env(name='OBS_VERSION', default='latest') }}"
# Host port for the app.
OBS_PORT = "{{ get_env(name='OBS_PORT', default='8080') }}"
# `json` for one JSON object per log line.
OBS_LOG_FORMAT = "{{ get_env(name='OBS_LOG_FORMAT', default='text') }}"
# Largest Geofabrik extract downloaded, MB.
OBS_REGIONS_MAX_DOWNLOAD_MB = "{{ get_env(name='OBS_REGIONS_MAX_DOWNLOAD_MB', default='2048') }}"
# Re-import regions after this many days unless a region has its own interval; 0 never (for all).
OBS_REGIONS_DEFAULT_REFRESH_DAYS = "{{ get_env(name='OBS_REGIONS_DEFAULT_REFRESH_DAYS', default='7') }}"
# Range of the interval a region can be given in the UI, days.
OBS_REGIONS_MIN_REFRESH_DAYS = "{{ get_env(name='OBS_REGIONS_MIN_REFRESH_DAYS', default='7') }}"
OBS_REGIONS_MAX_REFRESH_DAYS = "{{ get_env(name='OBS_REGIONS_MAX_REFRESH_DAYS', default='365') }}"

[tasks.down]
description = "Stop and remove the Docker Compose stack; keeps the regions and cache volumes (`mise run down -v` deletes them too)"
tools.fnox = "1.42.1"
# Under fnox too: compose.yaml refuses to load without OBS_REGIONS_TOKEN, even to stop.
run = "fnox exec -- docker compose down"

[tasks.fonts]
description = "Rebuild the UI fonts in crates/observation-client/assets/fonts/ from the Inter and Iosevka releases (scripts/subset-fonts.sh)"
# uv is a task tool (installed and locked for this task only); it runs the two PyPI packages
# at these versions.
tools = { uv = "0.13.5" }
env = { FONTTOOLS_VERSION = "4.67.0", FEATURE_FREEZER_VERSION = "1.32.2" }
run = "scripts/subset-fonts.sh"

[tasks."fixtures:demo"]
description = "Re-record the demo street's Overpass response (one real request; OBS_OVERPASS_URL picks the interpreter)"
dir = "{{config_root}}/crates/observation-server/fixtures"
run = "./fetch.sh"

[tasks."rulesets:check"]
description = "Diff .github/rulesets/ against the repository's live rulesets (needs gh)"
run = "scripts/rulesets.sh check"

[tasks."rulesets:apply"]
description = "Create or update the live rulesets from .github/rulesets/ (repository admin; `mise run rulesets:apply --prune` also deletes live ones with no file)"
confirm = { message = "Change the live rulesets on GitHub?", default = "no" }
run = "scripts/rulesets.sh apply"

[tasks."tasks:validate"]
description = "Check the task definitions of the selected environments (references, usage specs, templates); CI checks ci and dev"
# The current environment only (dev by default), so `check` never loads mise.ci.toml, which
# paranoid trust would then refuse. CI runs this with MISE_ENV=ci,dev to cover all three files.
run = "{{mise_bin | quote}} tasks validate"

[tasks.check]
description = "fmt, clippy, tests, design tokens, version sync and task definitions (the non-Docker CI checks; build is separate)"
depends = ["fmt", "clippy-native", "clippy-wasm", "test", "tokens", "sync", "tasks:validate"]

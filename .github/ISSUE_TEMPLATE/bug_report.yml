name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the area (bounding box) or camera setup if relevant.
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit, and `/api/config` `version` if you run the server.
  - type: input
    id: browser
    attributes:
      label: Browser and OS

name: CI

# Git-flow: long-lived and release branches build on push; feature work is
# covered by its pull_request run (no duplicate push runs).
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:

# A newer push supersedes a pull request run. Branch runs each get their own group, so none is
# cancelled or left queued: every commit on develop is checked and gets to save its caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    # bash -eo pipefail: a failing command on the left of a pipe fails the step.
    shell: bash

env:
  # mise.ci.toml on top of mise.toml: CI's tools, environment (cargo and nextest settings) and
  # tasks. setup-mise (.github/actions/, which pins the mise version) exports that environment
  # to the later steps, so it runs before setup-rust, whose rust-cache key includes the CARGO_*
  # and RUST* variables; setup-ci runs the two in that order.
  MISE_ENV: ci

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ci
      - run: mise run fmt

  clippy-native:
    name: clippy (native workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # xtask/ is a second workspace, which the task lints too: its target/ is cached with the
      # root one.
      - uses: $/.github/actions/setup-ci
        with:
          cache-key: native
          cache-workspaces: |
            . -> target
            xtask -> target
      - run: mise run clippy-native

  clippy-wasm:
    name: clippy (wasm client)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-ci
        with:
          cache-key: wasm-clippy
      - run: mise run clippy-wasm

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The task tests xtask/ too, a second workspace: its target/ is cached with the root one.
      # The coverage jobs restore this cache, so they name the same workspaces.
      - uses: $/.github/actions/setup-ci
        with:
          tools: cargo-nextest
          cache-key: test
          cache-workspaces: |
            . -> target
            xtask -> target
      # NEXTEST_PROFILE=ci (mise.ci.toml): .config/nextest.toml's profile for CI.
      - run: mise run test

  coverage:
    name: coverage (informational)
    # Not a required check, and a second instrumented build of the test suite: skip it on
    # pull requests and keep it for the long-lived branches.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restores the test job's cache (registry and dependencies) and never saves one of its
      # own: an instrumented build for an informational job is not worth ~1 GB of cache quota.
      # Same workspaces as the test job, or rust-cache would not find its cache.
      - uses: $/.github/actions/setup-ci
        with:
          tools: cargo-llvm-cov
          components: llvm-tools-preview
          cache-key: test
          cache-workspaces: |
            . -> target
            xtask -> target
          cache-save: false
      - name: Coverage
        run: |
          set -euo pipefail
          mise run coverage
          {
            echo "### Line coverage (the workspace except the wasm client)"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

  # Each crate's line coverage against its floor in .config/coverage.toml (a crate below its
  # floor fails; one with no floor warns). A required check (.github/rulesets). Pull requests
  # only, as the informational job above runs on pushes; same packages (mise.toml's
  # coverage_excludes).
  coverage-floor:
    name: coverage (per-crate floor)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test job's cache, restored and never saved (as the informational job does).
      - uses: $/.github/actions/setup-ci
        with:
          tools: cargo-llvm-cov
          components: llvm-tools-preview
          cache-key: test
          cache-workspaces: |
            . -> target
            xtask -> target
          cache-save: false
      - run: mise run coverage:check

  tokens:
    name: design tokens
    runs-on: ubuntu-24.04
    # A cold run installs the toolchain and builds xtask (under a minute); with the cache,
    # seconds.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The token check is an xtask command; only xtask's own workspace is built and cached.
      - uses: $/.github/actions/setup-ci
        with:
          cache-key: xtask
          cache-workspaces: xtask -> target
      - run: mise run tokens
      - run: mise run sync
      - run: mise run tasks:validate
        env:
          MISE_ENV: ci,dev

  hygiene:
    name: hygiene (typos, unused deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
        with:
          tools: typos cargo-shear
      - run: mise run typos
      # cargo-shear reads all three workspaces through `cargo metadata`.
      - uses: $/.github/actions/setup-rust
      - run: mise run shear

  wasm:
    name: wasm (trunk build)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # trunk comes from mise.toml, checksum-verified via mise.lock.
      # The size budget is an xtask command: xtask/'s target/ is cached with the root one.
      - uses: $/.github/actions/setup-ci
        with:
          tools: trunk
          cache-key: wasm-release
          cache-workspaces: |
            . -> target
            xtask -> target
          # trunk's wasm-bindgen and wasm-opt downloads (versions follow Cargo.lock and trunk).
          cache-directories: ~/.cache/trunk
      # The brotli sizes (about a minute of brotli -q 11) are reported on pushes only, to keep
      # them off the pull request critical path.
      - name: Install brotli (for the size report)
        if: github.event_name == 'push'
        run: |
          command -v brotli >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends brotli
          }
      - name: Build (release)
        run: |
          mise exec -- trunk --version
          mise run build
      # The docker job packages a stub dist/, so check the real one here.
      - name: Check dist/
        run: |
          grep -qis '<html' dist/index.html || { echo "::error::dist/index.html missing or not HTML"; exit 1; }
          compgen -G 'dist/*.wasm' >/dev/null || { echo "::error::no .wasm in dist/"; exit 1; }
          compgen -G 'dist/*.js' >/dev/null || { echo "::error::no .js in dist/"; exit 1; }
          # The app starts the coverage worker from this fixed (unhashed) name.
          test -f dist/coverage-worker_loader.js || { echo "::error::dist/coverage-worker_loader.js missing"; exit 1; }
          # trunk's pre_build hook wrote web/tokens.css and index.html inlined it.
          grep -q -- '--obs-bg:' dist/index.html || { echo "::error::design-token CSS not inlined into dist/index.html"; exit 1; }
      # Each module against its limit in .config/wasm-size-budget.toml (a few seconds of gzip),
      # with the brotli sizes on pushes; the table goes to the run's summary.
      - name: Wasm size budget
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = push ]; then mise run build:budget --brotli; else mise run build:budget; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  docker:
    name: docker (build + smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Runs alongside the wasm job rather than after it. The smoke test needs only a
    # dist/index.html, so the image takes a stub dist/ (Dockerfile target runtime-prebuilt),
    # the same one the Trivy scan uses, and both builds share the image-prebuilt layer cache.
    # The client built inside the image is covered by image-full.yml and Release.
    permissions:
      contents: read
    env:
      IMAGE: observation:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Writes both caches from develop; everything else reads them.
      - name: Build image (stub dist/)
        uses: $/.github/actions/build-image
        with:
          tag: ${{ env.IMAGE }}
          target: runtime-prebuilt
          cache-scope: image-prebuilt
          cache-save: true
      - name: Smoke test
        run: scripts/smoke-test-image.sh "${IMAGE}"
      - name: Build region agent image
        uses: $/.github/actions/build-image
        with:
          tag: observation-regions:ci
          target: regions
          cache-scope: image-regions
          cache-save: true
          setup-buildx: false
      - name: Smoke test region agent
        run: scripts/smoke-test-regions.sh observation-regions:ci

  # The real client in a headless browser: the wasm job's dist/ in the app image, loaded in
  # Chrome with WebGL2 on SwiftShader (tests/browser/smoke.cjs). Fails if the client does not
  # start, the demo street or the coverage worker does not load, or anything is logged as an
  # error or panic. Map tiles are answered by the test, so nothing reaches OpenStreetMap.
  browser:
    name: browser (wasm smoke test)
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: observation:browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      # The docker job's image with this run's client instead of its stub: the server layers come
      # from the image-prebuilt cache.
      - name: Build image (this run's client)
        uses: $/.github/actions/build-image
        with:
          tag: ${{ env.IMAGE }}
          target: runtime-prebuilt
          client-dist: ${{ runner.temp }}/dist
          cache-scope: image-prebuilt
      # The runner image's Google Chrome and Node.js; playwright-core (tests/browser/package-lock.json)
      # downloads no browser.
      - name: Browser smoke test
        env:
          OUT_DIR: ${{ runner.temp }}/browser
        run: scripts/browser-smoke-test.sh "${IMAGE}"
      - name: Upload screenshot and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke
          path: ${{ runner.temp }}/browser
          if-no-files-found: warn
          retention-days: 14

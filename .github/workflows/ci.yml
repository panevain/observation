name: CI

# Git-flow: long-lived and release branches build on push; feature work is
# covered by its pull_request run (no duplicate push runs).
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.13
          install: false
      - run: mise run fmt

  clippy-native:
    name: clippy (native workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.13
          install: false
      - run: mise run clippy-native

  clippy-wasm:
    name: clippy (wasm client)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm-clippy
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.13
          install: false
      - run: mise run clippy-wasm

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      # Bevy's native audio/input backends need these headers to compile the
      # client's unit tests on Linux.
      - name: Install system libraries (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.13
          install: false
      # cargo-nextest from its release archive, checksum-verified (same approach as Trivy).
      - name: Install cargo-nextest (pinned, checksum-verified)
        env:
          NEXTEST_VERSION: "0.9.148"
          NEXTEST_SHA256: 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/nextest.tar.gz" \
            "https://get.nexte.st/${NEXTEST_VERSION}/linux"
          echo "${NEXTEST_SHA256}  ${RUNNER_TEMP}/nextest.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/nextest.tar.gz" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: mise run test

  coverage:
    name: coverage (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Install cargo-llvm-cov (pinned, checksum-verified)
        env:
          LLVM_COV_VERSION: "0.9.1"
          LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
        run: |
          set -euo pipefail
          f="cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/${f}" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/${f}"
          echo "${LLVM_COV_SHA256}  ${RUNNER_TEMP}/${f}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${f}" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.13
          install: false
      - name: Coverage
        run: |
          set -euo pipefail
          mise run coverage
          {
            echo "### Coverage (observation-core + observation-server)"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

  tokens:
    name: design tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.13
          install: false
      - run: mise run tokens
      - run: mise run sync

  wasm:
    name: wasm (trunk build)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm-release
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      # trunk comes from mise.toml, checksum-verified via mise.lock.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.13
          install: true
      - name: Install brotli (for the size report)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends brotli
      - name: Build (release)
        run: |
          mise exec -- trunk --version
          mise run build
      - name: Wasm size report
        run: |
          set -euo pipefail
          {
            echo "### Wasm size report"
            echo
            echo "| file | raw | gzip -9 | brotli -q 11 |"
            echo "| --- | ---: | ---: | ---: |"
            found=0
            for f in dist/*.wasm; do
              [ -e "$f" ] || continue
              found=1
              raw=$(stat -c %s "$f")
              gz=$(gzip -9 -c "$f" | wc -c)
              if command -v brotli >/dev/null 2>&1; then
                br="$(brotli -q 11 -c "$f" | wc -c | awk '{printf "%.2f MiB", $1/1048576}')"
              else
                br="n/a"
              fi
              printf '| `%s` | %s | %s | %s |\n' "$(basename "$f")" \
                "$(awk -v n="$raw" 'BEGIN{printf "%.2f MiB", n/1048576}')" \
                "$(awk -v n="$gz" 'BEGIN{printf "%.2f MiB", n/1048576}')" \
                "$br"
            done
            if [ "$found" -eq 0 ]; then
              echo "| _no .wasm files in dist/_ | | | |"
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  docker:
    name: docker (build + smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The client is compiled once, in the wasm job; the image reuses its dist/
    # (Dockerfile target runtime-prebuilt) instead of building Bevy a second time.
    needs: wasm
    permissions:
      contents: read
    env:
      IMAGE: observation:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-prebuilt
          build-contexts: |
            client-dist=dist
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Smoke test
        run: |
          set -euo pipefail
          user="$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")"
          echo "image user: ${user}"
          case "${user}" in 65532:65532|65532|nonroot|nonroot:nonroot) ;; *) echo "image must run as nonroot" >&2; exit 1 ;; esac

          docker run -d --name obs -p 8080:8080 "${IMAGE}"
          trap 'docker logs obs || true; docker rm -f obs >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/healthz; then
              echo
              echo "healthz OK after ${i} attempt(s)"
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' obs)" != "true" ]; then
              echo "container exited early" >&2
              exit 1
            fi
            if [ "${i}" -eq 30 ]; then
              echo "healthz did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          # The static bundle must have been copied into the image.
          docker cp obs:/app/dist/index.html "${RUNNER_TEMP}/index.html"
          grep -qi '<html' "${RUNNER_TEMP}/index.html"

name: CI

# Git-flow: long-lived and release branches build on push; feature work is
# covered by its pull_request run (no duplicate push runs).
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:

# A newer push supersedes a pull request run. Branch runs each get their own group, so none is
# cancelled or left queued: every commit on develop is checked and gets to save its caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    # bash -eo pipefail: a failing command on the left of a pipe fails the step.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Line tables keep file:line in panics and backtraces; full debug info would roughly double
  # the size of target/ (and so of every cache) for no use in CI.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The jobs install exactly what they need; stop `mise run` from installing the rest.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_VERSION: 2026.10.13
  # Caches are written only by develop (the default branch). Pull requests, release/hotfix
  # branches and main all restore the default branch's caches, so writes from anywhere else
  # only use up the repository's cache quota and evict develop's entries.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/develop' }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache_save: ${{ env.SAVE_CACHE }}
      - run: mise run fmt

  clippy-native:
    name: clippy (native workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native
          save-if: ${{ env.SAVE_CACHE }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache_save: ${{ env.SAVE_CACHE }}
      - run: mise run clippy-native

  clippy-wasm:
    name: clippy (wasm client)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm-clippy
          save-if: ${{ env.SAVE_CACHE }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache_save: ${{ env.SAVE_CACHE }}
      - run: mise run clippy-wasm

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      # Bevy's native audio/input backends need these headers to compile the
      # client's unit tests on Linux. The client has tests only once it has a
      # library target (the same condition `mise run test` uses).
      - name: Install system libraries (Bevy)
        if: hashFiles('crates/observation-client/src/lib.rs') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ env.SAVE_CACHE }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache_save: ${{ env.SAVE_CACHE }}
      # cargo-nextest from its release archive, checksum-verified (same approach as Trivy).
      - name: Install cargo-nextest (pinned, checksum-verified)
        env:
          NEXTEST_VERSION: "0.9.148"
          NEXTEST_SHA256: 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/nextest.tar.gz" \
            "https://get.nexte.st/${NEXTEST_VERSION}/linux"
          echo "${NEXTEST_SHA256}  ${RUNNER_TEMP}/nextest.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/nextest.tar.gz" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: mise run test
        env:
          # .config/nextest.toml: report every failure, and end a hung test.
          NEXTEST_PROFILE: ci

  coverage:
    name: coverage (informational)
    # Not a required check, and a second instrumented build of the test suite: skip it on
    # pull requests and keep it for the long-lived branches.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
          save-if: ${{ env.SAVE_CACHE }}
      - name: Install cargo-llvm-cov (pinned, checksum-verified)
        env:
          LLVM_COV_VERSION: "0.9.1"
          LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
        run: |
          set -euo pipefail
          f="cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/${f}" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/${f}"
          echo "${LLVM_COV_SHA256}  ${RUNNER_TEMP}/${f}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${f}" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache_save: ${{ env.SAVE_CACHE }}
      - name: Coverage
        run: |
          set -euo pipefail
          mise run coverage
          {
            echo "### Coverage (observation-core + observation-server)"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

  tokens:
    name: design tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache_save: ${{ env.SAVE_CACHE }}
      - run: mise run tokens
      - run: mise run sync

  wasm:
    name: wasm (trunk build)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm-release
          save-if: ${{ env.SAVE_CACHE }}
          # trunk's wasm-bindgen and wasm-opt downloads (versions follow Cargo.lock and trunk).
          cache-directories: ~/.cache/trunk
      # trunk comes from mise.toml, checksum-verified via mise.lock.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          cache_save: ${{ env.SAVE_CACHE }}
      - name: Install brotli (for the size report)
        run: |
          command -v brotli >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends brotli
          }
      - name: Build (release)
        run: |
          mise exec -- trunk --version
          mise run build
      # The docker job packages a stub dist/, so check the real one here.
      - name: Check dist/
        run: |
          grep -qis '<html' dist/index.html || { echo "::error::dist/index.html missing or not HTML"; exit 1; }
          compgen -G 'dist/*.wasm' >/dev/null || { echo "::error::no .wasm in dist/"; exit 1; }
          compgen -G 'dist/*.js' >/dev/null || { echo "::error::no .js in dist/"; exit 1; }
      - name: Wasm size report
        run: |
          set -euo pipefail
          {
            echo "### Wasm size report"
            echo
            echo "| file | raw | gzip -9 | brotli -q 11 |"
            echo "| --- | ---: | ---: | ---: |"
            for f in dist/*.wasm; do
              raw=$(stat -c %s "$f")
              gz=$(gzip -9 -c "$f" | wc -c)
              if command -v brotli >/dev/null 2>&1; then
                br="$(brotli -q 11 -c "$f" | wc -c | awk '{printf "%.2f MiB", $1/1048576}')"
              else
                br="n/a"
              fi
              printf '| `%s` | %s | %s | %s |\n' "$(basename "$f")" \
                "$(awk -v n="$raw" 'BEGIN{printf "%.2f MiB", n/1048576}')" \
                "$(awk -v n="$gz" 'BEGIN{printf "%.2f MiB", n/1048576}')" \
                "$br"
            done
          } | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  docker:
    name: docker (build + smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Runs alongside the wasm job rather than after it. The smoke test needs only a
    # dist/index.html, so the image takes a stub dist/ (Dockerfile target runtime-prebuilt),
    # the same one the Trivy scan uses, and both builds share the image-prebuilt layer cache.
    # The client built inside the image is covered by image-full.yml and Release.
    permissions:
      contents: read
    env:
      IMAGE: observation:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stub client dist
        run: |
          mkdir -p "${RUNNER_TEMP}/stub-dist"
          echo '<!doctype html><html></html>' > "${RUNNER_TEMP}/stub-dist/index.html"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-prebuilt
          build-contexts: |
            client-dist=${{ runner.temp }}/stub-dist
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=image-prebuilt
          # Written from develop only (see SAVE_CACHE); everything else reads it.
          cache-to: ${{ env.SAVE_CACHE == 'true' && 'type=gha,scope=image-prebuilt,mode=max' || '' }}
      - name: Smoke test
        run: scripts/smoke-test-image.sh "${IMAGE}"
      - name: Build region agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: regions
          push: false
          load: true
          tags: observation-regions:ci
          cache-from: type=gha,scope=image-regions
          cache-to: ${{ env.SAVE_CACHE == 'true' && 'type=gha,scope=image-regions,mode=max' || '' }}
      - name: Smoke test region agent
        run: scripts/smoke-test-regions.sh observation-regions:ci

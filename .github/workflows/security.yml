name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Daily, deliberately off the hour: a new advisory against develop fails this run.
    # Advisories against the latest release are tracked by release-watch.yml.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # Default is `--all-features`, which is wrong for Bevy's feature set;
          # deny.toml controls the graph instead.
          arguments: --locked
          command-arguments: advisories bans licenses sources

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor comes from PyPI with hash-pinned requirements, not a third-party action.
      - name: Install zizmor
        run: |
          python3 -m venv "${RUNNER_TEMP}/zizmor-venv"
          "${RUNNER_TEMP}/zizmor-venv/bin/pip" install --require-hashes --no-deps \
            -r .github/zizmor-requirements.txt
          echo "${RUNNER_TEMP}/zizmor-venv/bin" >> "${GITHUB_PATH}"
      # Online audits (impostor commits, actions with known vulnerabilities, stale refs) use the
      # job's read-only token. `.github` covers dependabot.yml as well as the workflows.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SARIF output exits 0 even with findings, so it is written first for code scanning
          # and the plain run below is the one that fails the job.
          zizmor --format sarif --no-exit-codes .github > zizmor.sarif
          zizmor .github
      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('zizmor.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  # Both lockfiles, including the fuzz workspace's (cargo-deny covers only the root one: the fuzz
  # crate's licences are not on the allow-list, and it ships nothing). Ignores come from
  # .cargo/audit.toml. Yanked crates fail the job, as they do in cargo-deny.
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit (pinned, checksum-verified)
        run: scripts/ci-tools.sh install cargo-audit
      - name: cargo audit
        run: |
          cargo audit --deny yanked --file Cargo.lock
          cargo audit --deny yanked --file fuzz/Cargo.lock

  trivy:
    name: trivy (image + repo)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to code scanning
    env:
      IMAGE: observation:scan
      # No phoning home: Trivy 0.76.0 otherwise sends a version check plus
      # anonymous usage data to check.trivy.dev on every run. The vulnerability
      # DB and check bundle downloads (ghcr.io / mirror.gcr.io) are still needed.
      TRIVY_DISABLE_TELEMETRY: "true"
      TRIVY_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # From its pinned GitHub release (scripts/ci-tools.sh), NOT via aquasecurity/trivy-action
      # (its tags were compromised in March 2026, CVE-2026-33634).
      - name: Install Trivy (pinned, checksum-verified)
        run: |
          scripts/ci-tools.sh install trivy
          trivy --version

      # Repo scan first (cheap): Cargo.lock vulnerabilities, Dockerfile
      # misconfiguration, committed secrets. --ignore-unfixed only affects
      # vulnerabilities; CRITICAL/HIGH findings fail the job.
      - name: Trivy fs scan (misconfig, vuln, secret)
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-dirs target,dist,.git \
            --format sarif --output trivy-fs.sarif \
            --exit-code 1 \
            .

      - name: Upload fs SARIF
        if: ${{ !cancelled() && hashFiles('trivy-fs.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Trivy checks OS packages and the server binary; the static client is not
      # something it scans, so use a stub dist/ rather than compiling Bevy to wasm.
      - name: Stub client dist
        run: |
          mkdir -p "${RUNNER_TEMP}/stub-dist"
          echo '<!doctype html><html></html>' > "${RUNNER_TEMP}/stub-dist/index.html"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-prebuilt
          build-contexts: |
            client-dist=${{ runner.temp }}/stub-dist
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          # The CI docker job builds this same image (same stub dist/) and writes this cache
          # from develop; reading it is enough here.
          cache-from: type=gha,scope=image-prebuilt

      - name: Trivy image scan
        run: |
          trivy image \
            --image-src docker \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif --output trivy-image.sarif \
            --exit-code 1 \
            "${IMAGE}"

      # The server binary is built with cargo-auditable, so Trivy reads its crate list. Without
      # that (a plain `cargo build`), the scan silently covers only the Debian packages.
      - name: Image scan sees the server's crates
        run: |
          set -euo pipefail
          n="$(trivy image --image-src docker --scanners vuln --list-all-pkgs --format json --quiet "${IMAGE}" |
            jq '[.Results[]? | select(.Type == "rustbinary") | .Packages[]?] | length')"
          echo "Rust crates seen in the image: ${n}"
          [ "${n}" -gt 0 ] || { echo "::error::Trivy found no Rust crates in the image; is the server built with cargo auditable?"; exit 1; }

      - name: Upload image SARIF
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, deliberately off the hour. Scheduled runs are what make
    # rustsec/audit-check open/update advisory issues (remediation tracking).
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # Default is `--all-features`, which is wrong for Bevy's feature set;
          # deny.toml controls the graph instead.
          arguments: --locked
          command-arguments: advisories bans licenses sources

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # issues: write -> scheduled runs open/update one issue per new advisory.
    # checks: write -> reports the audit as a check run.
    permissions:
      contents: read
      issues: write # scheduled runs open/update advisory issues
      checks: write # publish the audit check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: trivy (image + repo)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to code scanning
    env:
      # Trivy is installed from a pinned GitHub release and verified against a
      # pinned sha256 -- NOT via aquasecurity/trivy-action (its tags were
      # compromised in March 2026, CVE-2026-33634).
      # Checksum source: trivy_0.76.0_checksums.txt in
      # https://github.com/aquasecurity/trivy/releases/tag/v0.76.0
      TRIVY_VERSION: "0.76.0"
      TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
      IMAGE: observation:scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy (pinned, checksum-verified)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/trivy-bin" trivy
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"

      - name: Trivy version
        run: trivy --version

      # Repo scan first (cheap): Cargo.lock vulnerabilities, Dockerfile
      # misconfiguration, committed secrets. --ignore-unfixed only affects
      # vulnerabilities; CRITICAL/HIGH findings fail the job.
      - name: Trivy fs scan (misconfig, vuln, secret)
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-dirs target,dist,.git \
            --format sarif --output trivy-fs.sarif \
            --exit-code 1 \
            .

      - name: Upload fs SARIF
        if: ${{ !cancelled() && hashFiles('trivy-fs.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=security-image
          cache-to: type=gha,scope=security-image,mode=max

      - name: Trivy image scan
        run: |
          trivy image \
            --image-src docker \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif --output trivy-image.sarif \
            --exit-code 1 \
            "${IMAGE}"

      - name: Upload image SARIF
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

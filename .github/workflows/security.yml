name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Nightly checks, after Fuzz (00:00) and before Release watch (02:00): a new advisory
    # against develop fails this run. Advisories against the latest release are tracked by
    # release-watch.yml.
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

# The checks are tasks in mise.ci.toml, next to their tools (pinned, and checksum-verified
# through mise.ci.lock) and settings; `mise -E ci run <task>` runs one locally.
env:
  MISE_ENV: ci
  # Code scanning uploads: not from fork or Dependabot pull requests, whose read-only token
  # cannot write security events.
  UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
        with:
          tools: cargo-deny
      # cargo-deny reads the dependency graph through `cargo metadata`.
      - uses: $/.github/actions/setup-rust
      - run: mise run deny

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
        with:
          tools: zizmor
      # Online audits (impostor commits, actions with known vulnerabilities, stale refs) use the
      # job's read-only token. The SARIF run (for code scanning) never fails; the plain run
      # after it does.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run zizmor --sarif zizmor.sarif
      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('zizmor.sarif') != '' && env.UPLOAD_SARIF == 'true' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  # Both lockfiles, including the fuzz workspace's (cargo-deny covers only the root one: the fuzz
  # crate's licences are not on the allow-list, and it ships nothing). Ignores come from
  # .cargo/audit.toml. Yanked crates fail the job, as they do in cargo-deny.
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
        with:
          tools: cargo-audit
      - run: mise run audit

  trivy:
    name: trivy (image + repo)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to code scanning
    env:
      IMAGE: observation:scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy from its release (mise.ci.toml), not aquasecurity/trivy-action, whose tags were
      # compromised in March 2026 (CVE-2026-33634). Telemetry and the version check are off
      # (TRIVY_* in mise.ci.toml).
      - uses: $/.github/actions/setup-mise
        with:
          tools: trivy

      # Repo scan first (cheap): Cargo.lock vulnerabilities, Dockerfile misconfiguration,
      # committed secrets. Fixable CRITICAL/HIGH findings fail the job.
      - name: Trivy fs scan (misconfig, vuln, secret)
        run: mise run scan:repo --sarif trivy-fs.sarif

      - name: Upload fs SARIF
        if: ${{ !cancelled() && hashFiles('trivy-fs.sarif') != '' && env.UPLOAD_SARIF == 'true' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Trivy checks OS packages and the server binary; the static client is not
      # something it scans, so use a stub dist/ rather than compiling Bevy to wasm.
      - name: Stub client dist
        run: |
          mkdir -p "${RUNNER_TEMP}/stub-dist"
          echo '<!doctype html><html></html>' > "${RUNNER_TEMP}/stub-dist/index.html"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-prebuilt
          build-contexts: |
            client-dist=${{ runner.temp }}/stub-dist
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          # The CI docker job builds this same image (same stub dist/) and writes this cache
          # from develop; reading it is enough here.
          cache-from: type=gha,scope=image-prebuilt

      - name: Trivy image scan
        run: mise run scan:image "${IMAGE}" --sarif trivy-image.sarif

      # The server binary is built with cargo-auditable, so Trivy reads its crate list. Without
      # that (a plain `cargo build`), the scan silently covers only the Debian packages.
      - name: Image scan sees the server's crates
        run: mise run scan:crates "${IMAGE}"

      - name: Upload image SARIF
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' && env.UPLOAD_SARIF == 'true' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

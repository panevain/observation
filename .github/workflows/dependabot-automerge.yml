name: Dependabot auto-merge

# Enables auto-merge (squash) on Dependabot pull requests that only bring semver patch updates,
# base image digest refreshes or the fuzz targets' nightly (`cargo xtask automerge list`);
# they merge once the required checks pass, and the weekly Prepare release ships them. Minor and
# major updates still need a person. To hold one, label it `hold`: it is skipped, and auto-merge
# is switched off if it was already on. The Pins PR's auto-merge is pins.yml's to set, but a
# `hold` on it is honoured here too.
# A sweep on a schedule rather than a pull_request workflow: the bot app enables auto-merge,
# so the merge into develop starts its push workflows (one enabled with GITHUB_TOKEN would
# not), and the app's key is only available to runs on develop.
# The checker that decides is built from the commit this run is on (develop on schedule; a
# dispatched branch reaches only the dry part, since `bot` admits develop, main and v* only),
# never from a pull request: no pull request's code is checked out. It is built uncached in the
# `find` job, whose token can only read, and the bot job receives only its JSON.
on:
  schedule:
    # Every 4 hours; the 06:00 run follows the 05:00-05:30 update window (Dependabot, Pins).
    - cron: "0 2-22/4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would happen (in the run's summary); change nothing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

# mise.ci.toml's tools, environment and tasks (setup-rust's ci:toolchain).
env:
  MISE_ENV: ci

jobs:
  find:
    name: find patch updates
    runs-on: ubuntu-24.04
    # An uncached build of xtask, then the gh calls.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
      has_work: ${{ steps.list.outputs.has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
        with:
          cache: "false"
      - uses: $/.github/actions/setup-rust
      - name: Build the checker
        run: cargo build --locked --quiet --manifest-path xtask/Cargo.toml --target-dir "${RUNNER_TEMP}/xtask-target"
      - name: Eligible pull requests
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--github-repo "${REPO}" --summary "${GITHUB_STEP_SUMMARY}")
          if [ "${DRY_RUN}" = true ]; then args+=(--dry-run); fi
          prs="$("${RUNNER_TEMP}/xtask-target/debug/xtask" automerge list "${args[@]}")"
          echo "prs=${prs}" >> "${GITHUB_OUTPUT}"
          has_work="$(jq -c '(.merge | length) + (.hold | length) > 0' <<<"${prs}")"
          echo "has_work=${has_work}" >> "${GITHUB_OUTPUT}"

  # Only when there is something to do, so the sweep does not deploy to `bot` each time, and
  # never on a dry run.
  merge:
    name: set auto-merge
    needs: find
    if: needs.find.outputs.has_work == 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: bot
    permissions: {}
    steps:
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write # Actions updates change .github/workflows
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          PRS: ${{ needs.find.outputs.prs }}
        run: |
          set -euo pipefail
          jq -r '.hold[].number' <<<"${PRS}" | while read -r n; do
            if gh pr merge "${n}" --repo "${REPO}" --disable-auto; then
              echo "- #${n}: on hold, auto-merge disabled" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "::warning::could not disable auto-merge on #${n}"
            fi
          done
          jq -r '.merge[] | "\(.number) \(.sha)"' <<<"${PRS}" | while read -r n sha; do
            # --match-head-commit: nothing pushed since the check above is merged unchecked.
            if gh pr merge "${n}" --repo "${REPO}" --auto --squash --match-head-commit "${sha}"; then
              echo "- #${n}: auto-merge enabled" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "::warning::could not enable auto-merge on #${n}"
            fi
          done

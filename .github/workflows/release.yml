name: Release

on:
  # develop -> :devel, v* tags -> :X.Y.Z and :latest. Pushes to main build
  # nothing: a release is published by its tag.
  push:
    branches: [develop]
    tags: ["v*"]

# Never cancel a publish half-way through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE_NAME: ghcr.io/panevain/observation

jobs:
  image:
    name: build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # Sigstore OIDC signing for attestations
      attestations: write # store the provenance attestation
      artifact-metadata: write # attest-build-provenance v4 storage record
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=devel,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          # `latest` skips pre-releases (v1.2.3-rc.1). prune-images.yml deletes any other tag
          # (sha256-<digest> attestation tags are kept while their image exists).

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # Keyless signature (Sigstore, GitHub OIDC identity) over the image digest, next to the
      # provenance attestation below. cosign is pinned and checksum-verified, as Trivy is.
      - name: Install cosign (pinned, checksum-verified)
        env:
          COSIGN_VERSION: "3.0.2"
          COSIGN_SHA256: 46dbdcb5467a3dfec2526923d0b3365e40c8d9dc00ec23d5aca3437449e8cbfd
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${RUNNER_TEMP}/cosign" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/cosign"

      - name: Sign image (cosign, keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: '"${RUNNER_TEMP}/cosign" sign --yes "${IMAGE_NAME}@${DIGEST}"'

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly health checks, Sundays: CodeQL 06:00, Full image 06:30, Scorecard 07:00, Prune 09:00.
    - cron: "0 6 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload CodeQL results
      actions: read # needed for private repos / the actions language
      packages: read # fetch CodeQL packs
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    env:
      # mise.ci.toml: CI's cargo settings and the ci:toolchain task.
      MISE_ENV: ci
      # Rust: the extractor runs cargo (build scripts and proc macros) in this directory, which
      # rust-cache keeps between runs (saved from develop only, like ci.yml's caches) instead of
      # a fresh scratch directory each time.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/target/codeql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        if: matrix.language == 'rust'
        with:
          version: 2026.10.18 # same as MISE_VERSION in ci.yml (mise run sync)
          install: false
          cache_save: ${{ github.ref == 'refs/heads/develop' }}
      - name: Install toolchain (from rust-toolchain.toml; the only one left installed)
        if: matrix.language == 'rust'
        run: mise run ci:toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.language == 'rust'
        with:
          workspaces: ". -> target/codeql"
          shared-key: codeql
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

name: Treemap

# Regenerates docs/images/wasm-bundle-treemap.svg for each release tag and opens a
# pull request with the result. The build is a separate fat-LTO compile with symbol
# names kept (15-20 minutes), so it runs only here and by hand, not on every push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  treemap:
    name: regenerate treemap
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # push the treemap branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The report stamps the tagged commit. The token is added only to the push below,
          # so no build script in the dependency tree can read it from .git/config.
          persist-credentials: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.13
          install: true
          cache: false
      # A release build makes trunk download the wasm-bindgen and wasm-opt versions matching
      # Cargo.lock into its cache (a dev build skips wasm-opt); the report script reuses them.
      - name: Fetch trunk's tools
        run: mise run build
      - name: Build report
        run: mise run treemap
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="chore/treemap-${REF_NAME}"
          # Commit only the SVG, on top of develop (not on the tagged release commit).
          cp docs/images/wasm-bundle-treemap.svg "${RUNNER_TEMP}/treemap.svg"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git_auth() { git -c "http.https://github.com/.extraheader=Authorization: Basic ${auth}" "$@"; }
          git_auth fetch --depth=1 origin develop
          git checkout --force -B "${branch}" FETCH_HEAD
          cp "${RUNNER_TEMP}/treemap.svg" docs/images/wasm-bundle-treemap.svg
          if git diff --quiet -- docs/images/wasm-bundle-treemap.svg; then
            echo "treemap unchanged on develop; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/wasm-bundle-treemap.svg
          git commit -m "docs: refresh wasm bundle treemap for ${REF_NAME}"
          # The branch is this workflow's own, so a re-run may replace it.
          git_auth push --force origin "${branch}"
          gh pr create --base develop --head "${branch}" \
            --title "docs: refresh wasm bundle treemap for ${REF_NAME}" \
            --body "Regenerated by the Treemap workflow from tag \`${REF_NAME}\`. Update the sizes quoted in README.md and docs/design.md if they changed." \
            || gh pr view "${branch}" --json url --jq .url

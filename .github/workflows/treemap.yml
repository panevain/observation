name: Treemap

# Regenerates docs/images/wasm-bundle-treemap.svg for each release tag and opens a
# pull request with the result. The build is a separate fat-LTO compile with symbol
# names kept (15-20 minutes), so it runs only here and by hand, not on every push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  treemap:
    name: regenerate treemap
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # push the treemap branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags check out detached; the report stamps the tagged commit.
          persist-credentials: true # needed to push the treemap branch below
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.13
          install: true
          cache: false
      # trunk downloads the wasm-bindgen and wasm-opt versions matching Cargo.lock into its
      # cache, which the report script reuses.
      - name: Fetch trunk's tools
        run: mise run build:dev
      - name: Build report
        run: mise run treemap
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/images/wasm-bundle-treemap.svg; then
            echo "treemap unchanged; nothing to do"
            exit 0
          fi
          branch="chore/treemap-${REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add docs/images/wasm-bundle-treemap.svg
          git commit -m "docs: refresh wasm bundle treemap for ${REF_NAME}"
          git push --force-with-lease origin "${branch}"
          gh pr create --base develop --head "${branch}" \
            --title "docs: refresh wasm bundle treemap for ${REF_NAME}" \
            --body "Regenerated by the Treemap workflow from tag \`${REF_NAME}\`. Update the sizes quoted in README.md and docs/design.md if they changed." \
            || gh pr view "${branch}" --json url --jq .url

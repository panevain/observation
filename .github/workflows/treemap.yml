name: Treemap

# Regenerates docs/images/wasm-bundle-treemap.svg from develop and opens a pull request with
# the result, by hand. Releases refresh it themselves: Prepare release (release-prep.yml)
# commits a fresh treemap on the release branch. The build is a separate fat-LTO compile with
# symbol names kept (15-20 minutes), so it does not run on every push.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  MISE_ENV: ci

jobs:
  build:
    name: regenerate treemap
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The report stamps the commit it was built from.
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.18 # same as MISE_VERSION in ci.yml (mise run sync)
          install_args: trunk
          cache: false
      - name: Install toolchain (from rust-toolchain.toml)
        run: mise run ci:toolchain
      # A release build makes trunk download the wasm-bindgen and wasm-opt versions matching
      # Cargo.lock into its cache (a dev build skips wasm-opt); the report script reuses them.
      #
      # Symbols are kept (strip and debug off, as scripts/wasm-size-report.sh does) so this one
      # fat-LTO compile serves both: trunk builds it, and the report reuses it with --no-build.
      - name: Build (release, symbols kept)
        env:
          CARGO_PROFILE_WASM_RELEASE_STRIP: "false"
          CARGO_PROFILE_WASM_RELEASE_DEBUG: "false"
        run: mise run build
      - name: Build report
        run: scripts/wasm-size-report.sh --no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: treemap
          path: docs/images/wasm-bundle-treemap.svg
          if-no-files-found: error
          retention-days: 7

  # The bot app opens the PR (so its checks start), from a job that builds nothing: the
  # dependency build above never shares a job with a write token.
  pr:
    name: open treemap PR
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: treemap
          path: ${{ runner.temp }}/treemap
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT: ${{ steps.bot.outputs.app-slug }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="chore/treemap-${REF_NAME}"
          # Commit only the SVG, on top of develop (not on the tagged release commit).
          git switch -c "${branch}"
          cp "${RUNNER_TEMP}/treemap/wasm-bundle-treemap.svg" docs/images/wasm-bundle-treemap.svg
          if git diff --quiet -- docs/images/wasm-bundle-treemap.svg; then
            echo "treemap unchanged on develop; nothing to do"
            exit 0
          fi
          scripts/ci-git.sh identity "${BOT}"
          git add docs/images/wasm-bundle-treemap.svg
          git -c core.hooksPath=/dev/null commit -m "docs: refresh wasm bundle treemap for ${REF_NAME}"
          # The branch is this workflow's own, so a re-run may replace it.
          scripts/ci-git.sh push-force "${branch}"
          gh pr create --base develop --head "${branch}" \
            --title "docs: refresh wasm bundle treemap for ${REF_NAME}" \
            --body "Regenerated by the Treemap workflow from \`${REF_NAME}\`. Update the sizes quoted in README.md and docs/design.md if they changed." \
            || gh pr view "${branch}" --json url --jq .url

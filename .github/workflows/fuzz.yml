name: Fuzz

# cargo-fuzz (libFuzzer) targets in fuzz/ for the parsers that handle
# untrusted input: bundles, scene files, Overpass responses, bbox queries,
# and the coverage geometry. Short smoke runs on PRs; longer runs nightly.
on:
  pull_request:
    # The targets link observation-core and observation-server, plus their path dependencies,
    # which inherit versions from the root Cargo.toml. Neither the client nor the region agent
    # is among them.
    paths:
      - .github/workflows/fuzz.yml
      - fuzz/**
      - Cargo.toml
      - crates/**
      - "!crates/observation-client/**"
      - "!crates/observation-regions/**"
  push:
    branches: [develop]
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: false
        default: "300"

# A newer push supersedes a pull request run. Every other run (develop pushes, nightly, manual)
# has its own group, so none is cancelled or left queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (from fuzz/rust-toolchain.toml; the only one left installed)
        working-directory: fuzz
        run: ../scripts/ci-rust-toolchain.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
          shared-key: fuzz
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Install cargo-fuzz (pinned in scripts/ci-tools.sh)
        working-directory: fuzz
        run: |
          ../scripts/ci-tools.sh install cargo-fuzz
          cargo fuzz --version
      - name: Lockfile is current
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build targets
        working-directory: fuzz
        run: cargo fuzz build
      # The working corpus carries over between runs: every run starts from the newest saved
      # one, and the nightly run saves what it grew to (about 25 MB), so coverage builds up
      # instead of restarting from the seeds each night.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run targets
        working-directory: fuzz
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SECONDS: ${{ inputs.seconds }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            schedule) secs=600 ;;
            workflow_dispatch) secs="${INPUT_SECONDS:-300}" ;;
            *) secs=30 ;;
          esac
          [[ "${secs}" =~ ^[0-9]+$ ]] || { echo "::error::seconds must be a number"; exit 1; }
          for t in $(cargo fuzz list); do
            mkdir -p "corpus/${t}"
            dirs=("corpus/${t}")
            if [ -d "seeds/${t}" ]; then dirs+=("seeds/${t}"); fi
            # On the nightly run, bbox_query's coverage stops growing within a minute (a small
            # parser at ~250k execs/s), while coverage_geometry runs a few hundred execs/s.
            t_secs="${secs}"
            if [ "${EVENT}" = schedule ]; then
              case "${t}" in
                bbox_query) t_secs=60 ;;
                coverage_geometry) t_secs=900 ;;
              esac
            fi
            echo "::group::${t} (${t_secs}s)"
            cargo fuzz run "${t}" "${dirs[@]}" -- -max_total_time="${t_secs}" -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Save corpus
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  # A crash on the nightly run would otherwise only send an email. Separate from the fuzz job
  # so that the job running the targets never holds a token that can write issues.
  report:
    name: report nightly crash
    needs: fuzz
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the crash issue
    steps:
      - name: Open or update the crash issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Fuzz: the nightly run found a crash"
          body="The nightly fuzz run failed: ${RUN_URL}. Crashing inputs are in its fuzz-artifacts artifact (kept 30 days); reproduce with \`cargo fuzz run <target> <file>\` in fuzz/."
          n="$(gh issue list --repo "${REPO}" --state open --search "in:title \"${title}\"" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "${n}" ]; then
            gh issue comment "${n}" --repo "${REPO}" --body "${body}"
          else
            gh issue create --repo "${REPO}" --title "${title}" --body "${body}"
          fi

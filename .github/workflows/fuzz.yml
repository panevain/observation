name: Fuzz

# cargo-fuzz (libFuzzer) targets in fuzz/ for the parsers that handle
# untrusted or hand-edited input: bundles, scene files, Overpass responses,
# bbox queries, coverage-job messages, the camera catalogue's RON, and the
# coverage geometry. Short smoke runs on PRs; longer runs nightly.
on:
  pull_request:
    # The targets link observation-core and observation-server, plus their path dependencies,
    # which inherit versions from the root Cargo.toml. Neither the client, its model nor the
    # region agent is among them.
    paths:
      - .github/workflows/fuzz.yml
      - .github/actions/**
      - fuzz/**
      - Cargo.toml
      - crates/**
      - "!crates/observation-client/**"
      - "!crates/observation-client-model/**"
      - "!crates/observation-regions/**"
  push:
    branches: [develop]
  schedule:
    # Nightly checks, first: Fuzz (58 min of fuzzing plus the build, so it overlaps the start of
    # Security; they share no cache or concurrency group), then Security (01:00), Release watch
    # (02:00).
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: false
        default: "300"

# A newer push supersedes a pull request run. Every other run (develop pushes, nightly, manual)
# has its own group, so none is cancelled or left queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

# mise.ci.toml: cargo-fuzz (pinned, checksum-verified through mise.ci.lock), CI's cargo
# settings, and the fuzz tasks (`mise -E ci run fuzz` runs them locally).
env:
  MISE_ENV: ci

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      # cargo-fuzz is built from crates.io (mise.ci.toml) with the root rust-toolchain.toml's
      # toolchain, which mise must have installed itself (a toolchain installed by rustup alone
      # does not count). setup-mise installs nothing here (no `tools`), so the action saves no
      # cache this job could restore, and cargo-fuzz is built on every run.
      - name: Install cargo-fuzz
        run: |
          set -euo pipefail
          mise which cargo-fuzz >/dev/null 2>&1 || mise install --locked rust cargo-fuzz
          mise which cargo-fuzz
      - uses: $/.github/actions/setup-rust
        with:
          dir: fuzz
          cache-workspaces: fuzz -> target
          cache-key: fuzz
      - name: Lockfile is current, build targets
        run: mise run fuzz:build
      # The working corpus carries over between runs: every run starts from the newest saved
      # one, and the nightly run saves what it grew to (about 25 MB), so coverage builds up
      # instead of restarting from the seeds each night.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # 30 s per target on pull requests and pushes, 10 min nightly (with the per-target times
      # of `mise run fuzz --nightly`), or the chosen time on a manual run.
      - name: Run targets
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SECONDS: ${{ inputs.seconds }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            schedule) mise run fuzz 600 --nightly ;;
            workflow_dispatch) mise run fuzz "${INPUT_SECONDS:-300}" ;;
            *) mise run fuzz 30 ;;
          esac
      - name: Save corpus
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  # A crash on the nightly run would otherwise only send an email. Separate from the fuzz job
  # so that the job running the targets never holds a token that can write issues.
  report:
    name: report nightly crash
    needs: fuzz
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the hedge checkout below
      issues: write # open or comment on the crash issue
    steps:
      # GitHub documents that a `$/` action needs no checkout. This sparse checkout (and the
      # contents: read above) is a deliberate hedge until a run in this repository has shown the
      # composite below resolving without one; then both can be dropped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/upsert-issue
      - name: Open or update the crash issue
        uses: $/.github/actions/upsert-issue
        with:
          token: ${{ github.token }}
          title: "Fuzz: the nightly run found a crash"
          body: "The nightly fuzz run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Crashing inputs are in its fuzz-artifacts artifact (kept 30 days); reproduce with `cargo fuzz run <target> <file>` in fuzz/."
          existing: comment

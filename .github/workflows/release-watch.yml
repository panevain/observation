name: Release watch

# Checks the latest release (the newest stable v* tag) every day for security fixes that a
# patch release would bring: crate advisories with a semver-compatible fix in its Cargo.lock,
# and fixable CRITICAL or HIGH OS vulnerabilities in its published images that a rebuild on
# current base images clears. Security.yml and Dependabot only look at develop.
#   - Something to fix: starts hotfix.yml, which opens the hotfix PR into main.
#   - Anything found, fixable or not (including fixable MEDIUM findings and advisories with no
#     compatible fix): kept in one issue per release, "Security: vX.Y.Z", closed when clear.
# Does nothing while a release or hotfix is waiting to be tagged, or a hotfix/* branch exists.
on:
  schedule:
    # After Security's daily run (04:17), off the hour.
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  MISE_ENV: ci

jobs:
  scan:
    name: scan latest release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.state.outputs.latest }}
      action: ${{ steps.check.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release state
        id: state
        run: |
          set -euo pipefail
          scripts/release-state.sh | tee -a "${GITHUB_OUTPUT}" > "${RUNNER_TEMP}/state"
          # shellcheck disable=SC1091
          . "${RUNNER_TEMP}/state"
          go=true
          if [ -z "${latest}" ]; then
            msg="No release yet; nothing to watch."; go=false
          elif [ "${pending}" = true ]; then
            msg="main is at ${main}, which is not tagged yet (a release or hotfix waits for its tag); skipping."; go=false
          elif [ "${hotfix}" = true ]; then
            msg="A hotfix/* branch exists (a hotfix is in progress); skipping."; go=false
          else
            msg="Checking v${latest}."
          fi
          echo "${msg}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "go=${go}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.state.outputs.go == 'true'
        with:
          ref: v${{ steps.state.outputs.latest }}
          path: release
          persist-credentials: false
      # cargo-audit and Trivy from this ref's mise.ci.toml (develop's), on PATH by their install
      # directories: without shims, nothing run in release/ resolves its own mise config.
      # No cache: they are downloaded fresh and checked against mise.ci.lock.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        if: steps.state.outputs.go == 'true'
        with:
          version: 2026.10.18 # same as MISE_VERSION in ci.yml (mise run sync)
          install_args: cargo-audit trivy
          cache: false
          add_shims_to_path: false
      - name: Install toolchain (from the release's rust-toolchain.toml)
        if: steps.state.outputs.go == 'true'
        run: mise run ci:toolchain -C release
      # Runs `cargo update` in the release checkout to see which advisories have a compatible
      # fix; nothing is pushed from here.
      - name: Check
        id: check
        if: steps.state.outputs.go == 'true'
        env:
          VERSION: ${{ steps.state.outputs.latest }}
        run: |
          set -euo pipefail
          action="$(python3 scripts/security-patch.py check --repo release --version "${VERSION}" --out "${RUNNER_TEMP}/report")"
          echo "action=${action}" >> "${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/report/summary.md" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.state.outputs.go == 'true'
        with:
          name: release-watch
          path: ${{ runner.temp }}/report/
          if-no-files-found: error
          retention-days: 14

  act:
    name: track and dispatch
    needs: scan
    if: needs.scan.outputs.action != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # the per-release tracking issue
      actions: write # start hotfix.yml
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-watch
          path: ${{ runner.temp }}/report
      - name: Tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.scan.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Security: v${VERSION}"
          body="${RUNNER_TEMP}/body.md"
          { cat "${RUNNER_TEMP}/report/summary.md"; echo; echo "_Updated by [Release watch](${RUN_URL})._"; } > "${body}"
          n="$(gh issue list --repo "${REPO}" --state open --search "in:title \"${title}\"" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ "$(jq -r .attention "${RUNNER_TEMP}/report/report.json")" = true ]; then
            if [ -n "${n}" ]; then
              gh issue edit "${n}" --repo "${REPO}" --body-file "${body}"
            else
              gh issue create --repo "${REPO}" --title "${title}" --body-file "${body}"
            fi
          elif [ -n "${n}" ]; then
            gh issue close "${n}" --repo "${REPO}" --comment "Nothing left to report for v${VERSION} (${RUN_URL})."
          fi
      - name: Start the hotfix
        if: needs.scan.outputs.action == 'hotfix'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run hotfix.yml --repo "${REPO}" --ref develop
          echo "Started hotfix.yml." >> "${GITHUB_STEP_SUMMARY}"

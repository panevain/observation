name: Prepare release

# Starts the git-flow release for you: creates release/<version> from develop, bumps the
# workspace version, refreshes Cargo.lock, dates the CHANGELOG, and opens the PR into main.
# Merging that PR is the release: release-tag.yml then tags main, Release publishes the
# images and the GitHub release, and a back-merge PR into develop follows (CONTRIBUTING.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 0.2.0)"
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: open release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The bot app's key lives in this environment (develop, main and v* tags only). The app
    # pushes and opens the PR, so the PR's checks start (GITHUB_TOKEN-made ones wait for a
    # manual approval).
    environment: bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false # the token is added to the push below only
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Bump version, lockfile and changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          scripts/set-version.sh "${VERSION}"
          today="$(date -u +%F)"
          sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${VERSION}] - ${today}/" CHANGELOG.md
      # Minted after the build steps above, so nothing they ran can read it.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT: ${{ steps.bot.outputs.app-slug }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/${VERSION}"
          scripts/ci-git.sh identity "${BOT}"
          git switch -c "${branch}"
          git -c core.hooksPath=/dev/null commit -am "release: ${VERSION}"
          scripts/ci-git.sh push "${branch}"
          if ! gh pr create --base main --head "${branch}" \
            --title "release: ${VERSION}" \
            --body "Release ${VERSION}. Merge with a merge commit when the checks pass: release-tag.yml then tags \`main\` as v${VERSION}, Release publishes the images and the GitHub release, and a back-merge PR into \`develop\` is opened."; then
            # Branch rulesets forbid force-pushes, so a leftover branch would block a re-run.
            echo "could not open the pull request; removing ${branch} so the workflow can be re-run." >&2
            scripts/ci-git.sh delete "${branch}"
            exit 1
          fi

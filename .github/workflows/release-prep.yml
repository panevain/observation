name: Prepare release

# Starts the git-flow release for you: creates release/<version> from develop, bumps the
# workspace version, refreshes Cargo.lock, dates the CHANGELOG, and opens the PR into main.
# The rest of the flow (merge, tag, back-merge) is in CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 0.2.0)"
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: open release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push release/<version>
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false # the token is added to the push below only
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Bump version, lockfile and changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a semver version: ${VERSION}" >&2; exit 1; }
          sed -i -E '/^\[workspace\.package\]/,/^$/ s/^version = "[^"]+"/version = "'"${VERSION}"'"/' Cargo.toml
          cargo update -w
          cargo update -w --manifest-path fuzz/Cargo.toml
          today="$(date -u +%F)"
          sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${VERSION}] - ${today}/" CHANGELOG.md
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -am "release: ${VERSION}"
          scripts/ci-git.sh push "${branch}"
          if ! gh pr create --base main --head "${branch}" \
            --title "release: ${VERSION}" \
            --body "Release ${VERSION}. Merge with a merge commit, then tag \`main\` as described in CONTRIBUTING.md. Checks do not start automatically on pull requests opened with GITHUB_TOKEN; push any follow-up commit to the branch (for example the dated changelog edit) to run them."; then
            # Branch rulesets forbid force-pushes, so a leftover branch would block a re-run.
            echo "could not open the pull request. Is 'Allow GitHub Actions to create and approve pull requests' enabled (Settings > Actions > General)? Removing ${branch} so the workflow can be re-run." >&2
            scripts/ci-git.sh delete "${branch}"
            exit 1
          fi

name: Prepare release

# Starts the git-flow release: creates release/<version> from develop, bumps the workspace
# version, refreshes Cargo.lock, dates the CHANGELOG, regenerates the bundle-size treemap and
# opens the PR into main, which merges itself once its checks pass. That merge is the
# release: release-tag.yml then tags main, Release publishes the images and the GitHub
# release, and a back-merge PR into develop follows (CONTRIBUTING.md).
#   Weekly: the version comes from CHANGELOG.md's [Unreleased] section, or is a patch release
#   when only dependencies or pins changed; a week with no shipped change is skipped
#   (`cargo xtask release plan`).
#   By hand: the same, or a given version, or a dev pre-release (X.Y.Z-dev.N).
# Nothing starts while a release or hotfix is open, waits for its tag or for its back-merge.
#
# Pre-releases (a version with a -suffix) never go through main, so main always holds the
# latest stable release and a hotfix can start from it at any time: the bot commits the
# version bump on top of develop and pushes only the vX.Y.Z-dev.N tag (no branch, PR or
# back-merge), which starts Release. CHANGELOG.md is left alone; the GitHub release takes its
# notes from [Unreleased].
on:
  schedule:
    # Tuesdays: after Monday's Dependabot and Pins pull requests have had a day to merge.
    - cron: "0 16 * * 2"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 0.2.0); empty to work it out"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Pre-release: dev makes X.Y.Z-dev.N (ignored when a version is given)"
        required: false
        type: choice
        options: [none, dev]
        default: none
      dry_run:
        description: Dry run (the checks, summary and artifacts only; no branch, pull request or tag)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  MISE_ENV: ci

jobs:
  # Works out what to release, with xtask, which this job builds from develop (uncached): the
  # release checks (each reason to wait goes to the summary) and then the plan, in one step on one
  # checkout, so the version and the sha come from the same commit the checks judged. Building
  # runs the build scripts and proc macros of xtask's crates, so this job holds no write
  # permission, no environment and no token beyond contents: read. Its outputs are not trusted
  # further on: prepare and pretag check the sha and the version in plain shell before they use
  # them and before they mint the bot token (see "Check the plan" there).
  plan:
    name: plan release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
          fetch-depth: 0 # tags, and the history since the latest release
      - uses: $/.github/actions/setup-mise
        with:
          cache: false
      - uses: $/.github/actions/setup-rust
      - uses: $/.github/actions/xtask
        id: xtask
      - name: Version
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          XTASK: ${{ steps.xtask.outputs.path }}
        run: |
          set -euo pipefail
          skip() { echo "$1" | tee -a "${GITHUB_STEP_SUMMARY}"; exit 0; }
          # A stable release goes through main, so it waits while a release or hotfix is open,
          # waits for its tag or for its back-merge (each reason goes to the summary). A
          # pre-release does not go through main: only the state is read.
          gate=(--prerelease)
          if [[ "${VERSION}" != *-* ]] && [ "${PRERELEASE:-none}" = none ]; then
            gate=()
          fi
          "${XTASK}" release gate prep "${gate[@]}" --output "${RUNNER_TEMP}/state" --summary "${GITHUB_STEP_SUMMARY}"
          # go=true or go=false on every path that does not fail.
          go="$(sed -n 's/^go=//p' "${RUNNER_TEMP}/state")"
          [[ "${go}" = true || "${go}" = false ]] || { echo "::error::no go=true|false from the release gate"; exit 1; }
          [ "${go}" = true ] || exit 0
          args=()
          if [ -n "${VERSION}" ]; then
            args=(--version "${VERSION}")
          elif [ "${PRERELEASE:-none}" != none ]; then
            args=(--prerelease "${PRERELEASE}")
          fi
          "${XTASK}" --repo . release plan "${args[@]}" > "${RUNNER_TEMP}/plan"
          cat "${RUNNER_TEMP}/plan"
          # Not sourced: the reason is free text.
          get() { sed -n "s/^$1=//p" "${RUNNER_TEMP}/plan"; }
          version="$(get version)"; kind="$(get kind)"; reason="$(get reason)"
          [ -n "${version}" ] || skip "${reason}"
          echo "Release **${version}** (${kind}): ${reason}." | tee -a "${GITHUB_STEP_SUMMARY}"
          prerelease=false
          [[ "${version}" != *-* ]] || prerelease=true
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

  # The bundle-size chart for the release, committed on the release branch below (stable
  # releases only: a pre-release ships develop's chart).
  treemap:
    name: treemap
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: $/.github/workflows/treemap-build.yml
    with:
      # The report stamps the develop commit the release starts from.
      ref: ${{ needs.plan.outputs.sha }}

  prepare:
    name: open release PR
    needs: [plan, treemap]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The bot app's key lives in this environment (develop, main and v* tags only). The app
    # pushes and opens the PR, so the PR's checks start (GITHUB_TOKEN-made ones wait for a
    # manual approval), and its auto-merge pushes to main, which starts release-tag.yml.
    environment: bot
    permissions:
      contents: read
    steps:
      # plan builds code, so its outputs are checked here in plain shell before anything uses
      # them: the sha's form before the checkout below, the rest once it is checked out.
      - name: Check the plan's commit id
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: '[[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the plan''s sha is not a commit id"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false # the token is added to the push below only
          fetch-depth: 0 # develop and the tags, for the check below and the changelog's list of commits
      - name: Check the plan
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          KIND: stable
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ inputs.version }}
          REQUESTED: ${{ inputs.prerelease }}
        # The same step in prepare and pretag (xtask's release plan tests run it).
        run: |
          set -euo pipefail
          refuse() { echo "::error::$1"; exit 1; }
          # The kind of release comes from what this run asked for, never from the plan: a schedule is
          # stable; by hand, a given version is a pre-release when it has a -suffix, and otherwise
          # prerelease=dev asks for one. A plan of the other kind runs the other job, which stops here.
          case "${EVENT}" in
            schedule) want=stable ;;
            workflow_dispatch)
              if [ -n "${GIVEN}" ]; then
                want=stable
                [[ "${GIVEN}" != *-* ]] || want=prerelease
              else
                case "${REQUESTED}" in
                  "" | none) want=stable ;;
                  dev) want=prerelease ;;
                  *) refuse "prerelease must be none or dev, not '${REQUESTED}'" ;;
                esac
              fi
              ;;
            *) refuse "unexpected event '${EVENT}'" ;;
          esac
          case "${KIND}" in
            stable | prerelease) ;;
            *) refuse "KIND must be stable or prerelease, not '${KIND}'" ;;
          esac
          [ "${KIND}" = "${want}" ] || refuse "this run asked for a ${want} release, not a ${KIND} one"
          # The commit: a full commit id, the one checked out, and on develop (refs/remotes/origin/develop
          # and the tags come from the checkout's fetch-depth: 0). A stable release also holds the latest
          # release (its back-merge has landed); a pre-release need not, as before.
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || refuse "the plan's sha is not a commit id: '${SHA}'"
          [ "$(git rev-parse HEAD)" = "${SHA}" ] || refuse "HEAD is not the plan's commit ${SHA}"
          git merge-base --is-ancestor "${SHA}" refs/remotes/origin/develop || refuse "${SHA} is not on develop"
          # X.Y.Z with each number at most 18 digits (so that shell arithmetic cannot wrap), without
          # leading zeros, into ${normed}.
          norm() {
            local x y z
            IFS=. read -r x y z <<<"$1"
            [[ ${#x} -le 18 && ${#y} -le 18 && ${#z} -le 18 ]] || refuse "version too large: $1"
            normed="$((10#${x})).$((10#${y})).$((10#${z}))"
          }
          latest="$(git tag --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"
          if [ -n "${latest}" ]; then
            if [ "${KIND}" = stable ]; then
              git merge-base --is-ancestor "refs/tags/v${latest}" "${SHA}" || refuse "${SHA} does not contain v${latest}"
            fi
            norm "${latest}"
            latest="${normed}"
          fi
          # The version: strict semver, of this job's kind, not tagged yet, and one the planner gives for
          # this request. Its value is only compared with versions worked out here, never computed with.
          n='(0|[1-9][0-9]*)'
          [[ "${VERSION}" =~ ^${n}\.${n}\.${n}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || refuse "not a semver version: '${VERSION}'"
          case "${KIND}" in
            stable) [[ "${VERSION}" != *-* ]] || refuse "${VERSION} is a pre-release" ;;
            prerelease) [[ "${VERSION}" == *-* ]] || refuse "${VERSION} is not a pre-release" ;;
          esac
          ! git rev-parse --quiet --verify "refs/tags/v${VERSION}" >/dev/null || refuse "v${VERSION} already exists"
          max() { printf '%s\n' "$1" "$2" | sort -V | tail -n 1; }
          if [ -n "${GIVEN}" ]; then
            # The version given to the run and nothing else, if it is newer than the latest release.
            [ "${VERSION}" = "${GIVEN}" ] || refuse "${VERSION} is not the version given to this run (${GIVEN})"
            if [ -n "${latest}" ]; then
              norm "${GIVEN%%-*}"
              [ "${normed}" != "${latest}" ] && [ "$(max "${normed}" "${latest}")" = "${normed}" ] ||
                refuse "${GIVEN} is not newer than the latest release v${latest}"
            fi
            exit 0
          fi
          # Otherwise the planner's range: with no release yet, develop's own version; else, for each
          # kind of bump, the bumped latest release or develop's version, whichever is higher (a major
          # bump only from 1.0.0 on).
          develop="$(scripts/workspace-version.sh)"
          norm "${develop%%-*}"
          develop="${normed}"
          if [ -z "${latest}" ]; then
            bases=("${develop}")
          else
            IFS=. read -r x y z <<<"${latest}"
            bases=("$(max "${x}.${y}.$((z + 1))" "${develop}")" "$(max "${x}.$((y + 1)).0" "${develop}")")
            [ "${x}" -lt 1 ] || bases+=("$(max "$((x + 1)).0.0" "${develop}")")
          fi
          base="${VERSION}"
          if [ "${KIND}" = prerelease ]; then
            # X.Y.Z-dev.N, N one more than the highest such tag of that X.Y.Z.
            [[ "${VERSION}" =~ ^([0-9.]+)-dev\.([1-9][0-9]*)$ ]] || refuse "${VERSION} is not X.Y.Z-dev.N"
            base="${BASH_REMATCH[1]}"
            number="${BASH_REMATCH[2]}"
            highest=0
            while read -r tag; do
              [ -n "${tag}" ] || continue
              k="${tag#"v${base}-dev."}"
              [[ "${k}" =~ ^[0-9]+$ ]] || continue
              [ "${#k}" -le 18 ] || refuse "pre-release number too large: ${tag}"
              [ "$((10#${k}))" -le "${highest}" ] || highest="$((10#${k}))"
            done <<<"$(git tag --list "v${base}-dev.*")"
            [ "${number}" = "$((highest + 1))" ] || refuse "${VERSION} is not the next pre-release of ${base} (dev.$((highest + 1)))"
          fi
          for b in "${bases[@]}"; do
            [ "${b}" != "${base}" ] || exit 0
          done
          refuse "${VERSION} is not a version this run may release (${bases[*]})"
      # The four reasons a stable release waits, checked again here in plain git: plan said to
      # go, but it builds code. Each one fails this job instead of skipping.
      - name: Release state
        run: |
          set -euo pipefail
          refuse() { echo "::error::$1"; exit 1; }
          # In an empty repository with the same origin: the script's shallow fetch of main must
          # not make this checkout shallow (the changelog below lists commits).
          scratch="$(mktemp -d "${RUNNER_TEMP}/state.XXXXXX")"
          git init -q "${scratch}"
          git -C "${scratch}" remote add origin "$(git remote get-url origin)"
          (cd "${scratch}" && "${OLDPWD}/scripts/release-state.sh") > "${RUNNER_TEMP}/state"
          get() { sed -n "s/^$1=//p" "${RUNNER_TEMP}/state"; }
          latest="$(get latest)"; main="$(get main)"; pending="$(get pending)"; hotfix="$(get hotfix)"
          # Before the first release main's initial version was never tagged, so that alone
          # is not a release waiting for its tag.
          [ "${pending}" = false ] || [ -z "${latest}" ] || refuse "main is at ${main}, which is not tagged yet (a release or hotfix waits for its tag)."
          [ -z "${latest}" ] || git merge-base --is-ancestor "v${latest}" HEAD || refuse "develop does not contain v${latest} yet (its back-merge is still open)."
          [ "${hotfix}" = false ] || refuse "A hotfix/* branch exists (a hotfix is in progress)."
          [ -z "$(git ls-remote --heads origin 'refs/heads/release/*')" ] || refuse "A release/* branch exists (a release is in progress)."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: treemap
          path: ${{ runner.temp }}/treemap
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Bump version, lockfile, changelog and treemap
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # The tree's own scripts, not xtask: what this job commits goes into a pull request
          # that merges itself without review, so it is written by a job that builds nothing.
          # (`cargo xtask release version set` and `release changelog` are tested against them.)
          scripts/set-version.sh "${VERSION}"
          python3 scripts/release-plan.py changelog --repo . --version "${VERSION}"
          cp "${RUNNER_TEMP}/treemap/wasm-bundle-treemap.svg" docs/images/wasm-bundle-treemap.svg
          git diff --stat
      # Minted after the build steps above, so nothing they ran can read it.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT: ${{ steps.bot.outputs.app-slug }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/${VERSION}"
          scripts/ci-git.sh identity "${BOT}"
          git switch -c "${branch}"
          git -c core.hooksPath=/dev/null commit -am "release: ${VERSION}"
          scripts/ci-git.sh push "${branch}"
          if ! url="$(gh pr create --base main --head "${branch}" \
            --title "release: ${VERSION}" \
            --body "Release ${VERSION}, opened by Prepare release. It merges itself (merge commit) when the checks pass: release-tag.yml then tags \`main\` as v${VERSION}, Release publishes the images and the GitHub release, and a back-merge PR into \`develop\` is opened. To hold the release, disable auto-merge on this PR.")"; then
            # Branch rulesets forbid force-pushes, so a leftover branch would block a re-run.
            echo "could not open the pull request; removing ${branch} so the workflow can be re-run." >&2
            scripts/ci-git.sh delete "${branch}"
            exit 1
          fi
          echo "${url}" | tee -a "${GITHUB_STEP_SUMMARY}"
          gh pr merge --auto --merge "${url}" || echo "::warning::could not enable auto-merge on ${url}; merge it by hand when it is green."

  # Pre-releases: a version-bump commit on top of develop, reachable only from its tag.
  # Release (release.yml) checks that the tag's parent is on develop and that the commit only
  # moves versions, then publishes it as a GitHub pre-release.
  pretag:
    name: tag pre-release
    needs: plan
    if: needs.plan.outputs.prerelease == 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The app pushes the tag (it may create v* tags), so the push starts Release.
    environment: bot
    permissions:
      contents: read
    steps:
      # plan builds code, so its outputs are checked here in plain shell before anything uses
      # them: the sha's form before the checkout below, the rest once it is checked out.
      - name: Check the plan's commit id
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: '[[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the plan''s sha is not a commit id"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false # the token is added to the push below only
          fetch-depth: 0 # develop and the tags, for the check below
      - name: Check the plan
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          KIND: prerelease
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ inputs.version }}
          REQUESTED: ${{ inputs.prerelease }}
        # The same step in prepare and pretag (xtask's release plan tests run it).
        run: |
          set -euo pipefail
          refuse() { echo "::error::$1"; exit 1; }
          # The kind of release comes from what this run asked for, never from the plan: a schedule is
          # stable; by hand, a given version is a pre-release when it has a -suffix, and otherwise
          # prerelease=dev asks for one. A plan of the other kind runs the other job, which stops here.
          case "${EVENT}" in
            schedule) want=stable ;;
            workflow_dispatch)
              if [ -n "${GIVEN}" ]; then
                want=stable
                [[ "${GIVEN}" != *-* ]] || want=prerelease
              else
                case "${REQUESTED}" in
                  "" | none) want=stable ;;
                  dev) want=prerelease ;;
                  *) refuse "prerelease must be none or dev, not '${REQUESTED}'" ;;
                esac
              fi
              ;;
            *) refuse "unexpected event '${EVENT}'" ;;
          esac
          case "${KIND}" in
            stable | prerelease) ;;
            *) refuse "KIND must be stable or prerelease, not '${KIND}'" ;;
          esac
          [ "${KIND}" = "${want}" ] || refuse "this run asked for a ${want} release, not a ${KIND} one"
          # The commit: a full commit id, the one checked out, and on develop (refs/remotes/origin/develop
          # and the tags come from the checkout's fetch-depth: 0). A stable release also holds the latest
          # release (its back-merge has landed); a pre-release need not, as before.
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || refuse "the plan's sha is not a commit id: '${SHA}'"
          [ "$(git rev-parse HEAD)" = "${SHA}" ] || refuse "HEAD is not the plan's commit ${SHA}"
          git merge-base --is-ancestor "${SHA}" refs/remotes/origin/develop || refuse "${SHA} is not on develop"
          # X.Y.Z with each number at most 18 digits (so that shell arithmetic cannot wrap), without
          # leading zeros, into ${normed}.
          norm() {
            local x y z
            IFS=. read -r x y z <<<"$1"
            [[ ${#x} -le 18 && ${#y} -le 18 && ${#z} -le 18 ]] || refuse "version too large: $1"
            normed="$((10#${x})).$((10#${y})).$((10#${z}))"
          }
          latest="$(git tag --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"
          if [ -n "${latest}" ]; then
            if [ "${KIND}" = stable ]; then
              git merge-base --is-ancestor "refs/tags/v${latest}" "${SHA}" || refuse "${SHA} does not contain v${latest}"
            fi
            norm "${latest}"
            latest="${normed}"
          fi
          # The version: strict semver, of this job's kind, not tagged yet, and one the planner gives for
          # this request. Its value is only compared with versions worked out here, never computed with.
          n='(0|[1-9][0-9]*)'
          [[ "${VERSION}" =~ ^${n}\.${n}\.${n}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || refuse "not a semver version: '${VERSION}'"
          case "${KIND}" in
            stable) [[ "${VERSION}" != *-* ]] || refuse "${VERSION} is a pre-release" ;;
            prerelease) [[ "${VERSION}" == *-* ]] || refuse "${VERSION} is not a pre-release" ;;
          esac
          ! git rev-parse --quiet --verify "refs/tags/v${VERSION}" >/dev/null || refuse "v${VERSION} already exists"
          max() { printf '%s\n' "$1" "$2" | sort -V | tail -n 1; }
          if [ -n "${GIVEN}" ]; then
            # The version given to the run and nothing else, if it is newer than the latest release.
            [ "${VERSION}" = "${GIVEN}" ] || refuse "${VERSION} is not the version given to this run (${GIVEN})"
            if [ -n "${latest}" ]; then
              norm "${GIVEN%%-*}"
              [ "${normed}" != "${latest}" ] && [ "$(max "${normed}" "${latest}")" = "${normed}" ] ||
                refuse "${GIVEN} is not newer than the latest release v${latest}"
            fi
            exit 0
          fi
          # Otherwise the planner's range: with no release yet, develop's own version; else, for each
          # kind of bump, the bumped latest release or develop's version, whichever is higher (a major
          # bump only from 1.0.0 on).
          develop="$(scripts/workspace-version.sh)"
          norm "${develop%%-*}"
          develop="${normed}"
          if [ -z "${latest}" ]; then
            bases=("${develop}")
          else
            IFS=. read -r x y z <<<"${latest}"
            bases=("$(max "${x}.${y}.$((z + 1))" "${develop}")" "$(max "${x}.$((y + 1)).0" "${develop}")")
            [ "${x}" -lt 1 ] || bases+=("$(max "$((x + 1)).0.0" "${develop}")")
          fi
          base="${VERSION}"
          if [ "${KIND}" = prerelease ]; then
            # X.Y.Z-dev.N, N one more than the highest such tag of that X.Y.Z.
            [[ "${VERSION}" =~ ^([0-9.]+)-dev\.([1-9][0-9]*)$ ]] || refuse "${VERSION} is not X.Y.Z-dev.N"
            base="${BASH_REMATCH[1]}"
            number="${BASH_REMATCH[2]}"
            highest=0
            while read -r tag; do
              [ -n "${tag}" ] || continue
              k="${tag#"v${base}-dev."}"
              [[ "${k}" =~ ^[0-9]+$ ]] || continue
              [ "${#k}" -le 18 ] || refuse "pre-release number too large: ${tag}"
              [ "$((10#${k}))" -le "${highest}" ] || highest="$((10#${k}))"
            done <<<"$(git tag --list "v${base}-dev.*")"
            [ "${number}" = "$((highest + 1))" ] || refuse "${VERSION} is not the next pre-release of ${base} (dev.$((highest + 1)))"
          fi
          for b in "${bases[@]}"; do
            [ "${b}" != "${base}" ] || exit 0
          done
          refuse "${VERSION} is not a version this run may release (${bases[*]})"
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Bump version and lockfiles
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # The tree's own script, not xtask: the tagged commit is published without review, so
          # it is written by a job that builds nothing.
          scripts/set-version.sh "${VERSION}"
          git diff --stat
      # Minted after the build steps above, so nothing they ran can read it.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit and tag
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT: ${{ steps.bot.outputs.app-slug }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          scripts/ci-git.sh identity "${BOT}"
          git -c core.hooksPath=/dev/null commit -am "release: ${VERSION}"
          git -c core.hooksPath=/dev/null tag -a "v${VERSION}" -m "v${VERSION}"
          scripts/ci-git.sh push-tag "v${VERSION}"
          echo "### Tagged v${VERSION} (pre-release, on top of develop)" >> "${GITHUB_STEP_SUMMARY}"

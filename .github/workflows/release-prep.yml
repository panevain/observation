name: Prepare release

# Starts the git-flow release: creates release/<version> from develop, bumps the workspace
# version, refreshes Cargo.lock, dates the CHANGELOG, regenerates the bundle-size treemap and
# opens the PR into main, which merges itself once its checks pass. That merge is the
# release: release-tag.yml then tags main, Release publishes the images and the GitHub
# release, and a back-merge PR into develop follows (CONTRIBUTING.md).
#   Weekly: the version comes from CHANGELOG.md's [Unreleased] section, or is a patch release
#   when only dependencies or pins changed; a week with no shipped change is skipped
#   (`cargo xtask release plan`).
#   By hand: the same, or a given version, or a dev pre-release (X.Y.Z-dev.N).
# Nothing starts while a release or hotfix is open, waits for its tag or for its back-merge.
#
# Pre-releases (a version with a -suffix) never go through main, so main always holds the
# latest stable release and a hotfix can start from it at any time: the bot commits the
# version bump on top of develop and pushes only the vX.Y.Z-dev.N tag (no branch, PR or
# back-merge), which starts Release. CHANGELOG.md is left alone; the GitHub release takes its
# notes from [Unreleased].
on:
  schedule:
    # Tuesdays: after Monday's Dependabot and Pins pull requests have had a day to merge.
    - cron: "0 16 * * 2"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 0.2.0); empty to work it out"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Pre-release: dev makes X.Y.Z-dev.N (ignored when a version is given)"
        required: false
        type: choice
        options: [none, dev]
        default: none
      dry_run:
        description: Dry run (the checks, summary and artifacts only; no branch, pull request or tag)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  MISE_ENV: ci

jobs:
  # Works out what to release, with xtask, which this job builds from develop (uncached): the
  # release checks (each reason to wait goes to the summary) and then the plan, in one step on one
  # checkout, so the version and the sha come from the same commit the checks judged. Building
  # runs the build scripts and proc macros of xtask's crates, so this job holds no write
  # permission, no environment and no token beyond contents: read. Its outputs are not trusted
  # further on: prepare and pretag check the sha and the version in plain shell before they use
  # them and before they mint the bot token (see "Check the plan" there).
  plan:
    name: plan release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
          fetch-depth: 0 # tags, and the history since the latest release
      - uses: $/.github/actions/setup-mise
        with:
          cache: false
      - uses: $/.github/actions/setup-rust
      - uses: $/.github/actions/xtask
        id: xtask
      - name: Version
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          XTASK: ${{ steps.xtask.outputs.path }}
        run: |
          set -euo pipefail
          skip() { echo "$1" | tee -a "${GITHUB_STEP_SUMMARY}"; exit 0; }
          # A stable release goes through main, so it waits while a release or hotfix is open,
          # waits for its tag or for its back-merge (each reason goes to the summary). A
          # pre-release does not go through main: only the state is read.
          gate=(--prerelease)
          if [[ "${VERSION}" != *-* ]] && [ "${PRERELEASE:-none}" = none ]; then
            gate=()
          fi
          "${XTASK}" release gate prep "${gate[@]}" --output "${RUNNER_TEMP}/state" --summary "${GITHUB_STEP_SUMMARY}"
          # go=true or go=false on every path that does not fail.
          go="$(sed -n 's/^go=//p' "${RUNNER_TEMP}/state")"
          [[ "${go}" = true || "${go}" = false ]] || { echo "::error::no go=true|false from the release gate"; exit 1; }
          [ "${go}" = true ] || exit 0
          args=()
          if [ -n "${VERSION}" ]; then
            args=(--version "${VERSION}")
          elif [ "${PRERELEASE:-none}" != none ]; then
            args=(--prerelease "${PRERELEASE}")
          fi
          "${XTASK}" --repo . release plan "${args[@]}" > "${RUNNER_TEMP}/plan"
          cat "${RUNNER_TEMP}/plan"
          # Not sourced: the reason is free text.
          get() { sed -n "s/^$1=//p" "${RUNNER_TEMP}/plan"; }
          version="$(get version)"; kind="$(get kind)"; reason="$(get reason)"
          [ -n "${version}" ] || skip "${reason}"
          echo "Release **${version}** (${kind}): ${reason}." | tee -a "${GITHUB_STEP_SUMMARY}"
          prerelease=false
          [[ "${version}" != *-* ]] || prerelease=true
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"
      # The release's edits, made here so that the bot jobs below build and run nothing: the
      # version and both lockfiles, and for a stable release the dated changelog, as a patch
      # that they check and apply (prepare adds the treemap from its own artifact).
      - name: Edits
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          XTASK: ${{ steps.xtask.outputs.path }}
        run: |
          set -euo pipefail
          "${XTASK}" --repo . release version set -- "${VERSION}"
          [ "${PRERELEASE}" = true ] || "${XTASK}" --repo . release changelog --version "${VERSION}"
          mkdir -p "${RUNNER_TEMP}/release"
          git diff --binary > "${RUNNER_TEMP}/release/release.patch"
          git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.version != ''
        with:
          name: release
          path: ${{ runner.temp }}/release/release.patch
          if-no-files-found: error
          retention-days: 14

  # The bundle-size chart for the release, committed on the release branch below (stable
  # releases only: a pre-release ships develop's chart).
  treemap:
    name: treemap
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: $/.github/workflows/treemap-build.yml
    with:
      # The report stamps the develop commit the release starts from.
      ref: ${{ needs.plan.outputs.sha }}

  prepare:
    name: open release PR
    needs: [plan, treemap]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The bot app's key lives in this environment (develop, main and v* tags only). The app
    # pushes and opens the PR, so the PR's checks start (GITHUB_TOKEN-made ones wait for a
    # manual approval), and its auto-merge pushes to main, which starts release-tag.yml.
    environment: bot
    permissions:
      contents: read
    steps:
      # plan builds code, so its outputs are checked here in plain shell before anything uses
      # them: the sha's form before the checkout below, the rest once it is checked out.
      - name: Check the plan's commit id
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: '[[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the plan''s sha is not a commit id"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false # the token is added to the push below only
          fetch-depth: 0 # develop and the tags, for the check below and the changelog's list of commits
      - name: Check the plan
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          KIND: stable
          GIVEN: ${{ inputs.version }}
        # The same step in prepare and pretag (xtask's release plan tests run it).
        run: |
          set -euo pipefail
          refuse() { echo "::error::$1"; exit 1; }
          # The commit: a full commit id, the one checked out, on develop, and holding the latest
          # release (refs/remotes/origin/develop and the tags come from the checkout's fetch-depth: 0).
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || refuse "the plan's sha is not a commit id: '${SHA}'"
          [ "$(git rev-parse HEAD)" = "${SHA}" ] || refuse "HEAD is not the plan's commit ${SHA}"
          git merge-base --is-ancestor "${SHA}" refs/remotes/origin/develop || refuse "${SHA} is not on develop"
          latest="$(git tag --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"
          if [ -n "${latest}" ]; then
            git merge-base --is-ancestor "refs/tags/v${latest}" "${SHA}" || refuse "${SHA} does not contain v${latest}"
          fi
          # The version: strict semver, of the kind this job releases, not tagged yet, and one that the
          # plan could have given: the version given to the run, or else a single bump of the latest
          # release or develop's own version when that is ahead of it (plus -dev.N for a pre-release).
          n='(0|[1-9][0-9]*)'
          [[ "${VERSION}" =~ ^${n}\.${n}\.${n}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || refuse "not a semver version: '${VERSION}'"
          case "${KIND}" in
            stable) [[ "${VERSION}" != *-* ]] || refuse "${VERSION} is a pre-release" ;;
            prerelease) [[ "${VERSION}" == *-* ]] || refuse "${VERSION} is not a pre-release" ;;
            *) refuse "KIND must be stable or prerelease, not '${KIND}'" ;;
          esac
          ! git rev-parse --quiet --verify "refs/tags/v${VERSION}" >/dev/null || refuse "v${VERSION} already exists"
          norm() { local x y z; IFS=. read -r x y z <<<"$1"; echo "$((10#${x})).$((10#${y})).$((10#${z}))"; }
          base="${VERSION}"
          if [ -n "${GIVEN}" ]; then
            allowed=("${GIVEN}")
          else
            allowed=()
            if [ -n "${latest}" ]; then
              latest="$(norm "${latest}")"
              IFS=. read -r x y z <<<"${latest}"
              allowed=("$((x + 1)).0.0" "${x}.$((y + 1)).0" "${x}.${y}.$((z + 1))")
            fi
            develop="$(scripts/workspace-version.sh)"
            develop="$(norm "${develop%%-*}")"
            if [ -z "${latest}" ] || [ "$(printf '%s\n' "${latest}" "${develop}" | sort -V | tail -n 1)" != "${latest}" ]; then
              allowed+=("${develop}")
            fi
            if [ "${KIND}" = prerelease ]; then
              [[ "${VERSION}" =~ ^([0-9.]+)-dev\.[1-9][0-9]*$ ]] || refuse "${VERSION} is not X.Y.Z-dev.N"
              base="${BASH_REMATCH[1]}"
            fi
          fi
          for a in "${allowed[@]}"; do
            [ "${a}" != "${base}" ] || exit 0
          done
          refuse "${VERSION} is not a version this run may release (${allowed[*]})"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Apply the plan's edits
        env:
          PATCH: ${{ runner.temp }}/release/release.patch
          ALLOWED: 'Cargo\.toml|Cargo\.lock|fuzz/Cargo\.lock|CHANGELOG\.md'
        # The same step in prepare and pretag, each with its own list (the version, the lockfiles and the changelog).
        run: |
          set -euo pipefail
          # plan builds code, so its patch is checked here, with git alone, before the token is
          # minted: every entry must change the text of an existing regular file whose whole
          # path is on ALLOWED. No file added, deleted, renamed or copied, no mode or type change
          # (a symlink or gitlink), no binary patch; anything else fails. What those files now
          # say is not judged here.
          tab=$'\t'
          refuse() { echo "::error::$1"; exit 1; }
          ! grep -qE '^(GIT binary patch|Binary files .* differ)$' "${PATCH}" || refuse "the patch holds a binary change"
          tr -d '\000' < "${PATCH}" | cmp -s - "${PATCH}" || refuse "the patch holds a NUL byte"
          # Before applying: one "added<TAB>deleted<TAB>path" line per entry and no summary line
          # (create, delete, rename, copy, mode change, rewrite); "-" counts mean a binary entry.
          stat="$(git apply --numstat --summary "${PATCH}")"
          bad="$(grep -vxE "[0-9]+${tab}[0-9]+${tab}(${ALLOWED})" <<<"${stat}" || true)"
          [ -n "${stat}" ] && [ -z "${bad}" ] || refuse "unexpected changes: ${bad:-none}"
          git apply --index "${PATCH}"
          # After: each staged entry modifies a regular file, mode 100644 before and after.
          staged="$(git diff --cached --raw --no-renames --no-abbrev)"
          bad="$(grep -vxE ":100644 100644 [0-9a-f]{40} [0-9a-f]{40} M${tab}(${ALLOWED})" <<<"${staged}" || true)"
          [ -n "${staged}" ] && [ -z "${bad}" ] || refuse "unexpected changes: ${bad:-none}"
          git diff --cached --stat
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: treemap
          path: ${{ runner.temp }}/treemap
      - name: Treemap
        run: cp "${RUNNER_TEMP}/treemap/wasm-bundle-treemap.svg" docs/images/wasm-bundle-treemap.svg
      # Minted after the checks above; nothing in this job builds or runs code from the tree but
      # scripts/ci-git.sh.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Commit
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT: ${{ steps.bot.outputs.app-slug }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          scripts/ci-git.sh identity "${BOT}"
          git switch -c "release/${VERSION}"
          git -c core.hooksPath=/dev/null commit -am "release: ${VERSION}"
      - name: Open pull request
        uses: $/.github/actions/open-pr
        with:
          token: ${{ steps.bot.outputs.token }}
          branch: release/${{ needs.plan.outputs.version }}
          base: main
          title: "release: ${{ needs.plan.outputs.version }}"
          body: "Release ${{ needs.plan.outputs.version }}, opened by Prepare release. It merges itself (merge commit) when the checks pass: release-tag.yml then tags `main` as v${{ needs.plan.outputs.version }}, Release publishes the images and the GitHub release, and a back-merge PR into `develop` is opened. To hold the release, disable auto-merge on this PR."
          # Branch rulesets forbid force-pushes, so a leftover branch would block a re-run.
          delete-branch-on-failure: true
          summary: true
          auto-merge: merge
          auto-merge-warning: "; merge it by hand when it is green."

  # Pre-releases: a version-bump commit on top of develop, reachable only from its tag.
  # Release (release.yml) checks that the tag's parent is on develop and that the commit only
  # moves versions, then publishes it as a GitHub pre-release.
  pretag:
    name: tag pre-release
    needs: plan
    if: needs.plan.outputs.prerelease == 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The app pushes the tag (it may create v* tags), so the push starts Release.
    environment: bot
    permissions:
      contents: read
    steps:
      # plan builds code, so its outputs are checked here in plain shell before anything uses
      # them: the sha's form before the checkout below, the rest once it is checked out.
      - name: Check the plan's commit id
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: '[[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the plan''s sha is not a commit id"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false # the token is added to the push below only
          fetch-depth: 0 # develop and the tags, for the check below
      - name: Check the plan
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          KIND: prerelease
          GIVEN: ${{ inputs.version }}
        # The same step in prepare and pretag (xtask's release plan tests run it).
        run: |
          set -euo pipefail
          refuse() { echo "::error::$1"; exit 1; }
          # The commit: a full commit id, the one checked out, on develop, and holding the latest
          # release (refs/remotes/origin/develop and the tags come from the checkout's fetch-depth: 0).
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || refuse "the plan's sha is not a commit id: '${SHA}'"
          [ "$(git rev-parse HEAD)" = "${SHA}" ] || refuse "HEAD is not the plan's commit ${SHA}"
          git merge-base --is-ancestor "${SHA}" refs/remotes/origin/develop || refuse "${SHA} is not on develop"
          latest="$(git tag --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"
          if [ -n "${latest}" ]; then
            git merge-base --is-ancestor "refs/tags/v${latest}" "${SHA}" || refuse "${SHA} does not contain v${latest}"
          fi
          # The version: strict semver, of the kind this job releases, not tagged yet, and one that the
          # plan could have given: the version given to the run, or else a single bump of the latest
          # release or develop's own version when that is ahead of it (plus -dev.N for a pre-release).
          n='(0|[1-9][0-9]*)'
          [[ "${VERSION}" =~ ^${n}\.${n}\.${n}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || refuse "not a semver version: '${VERSION}'"
          case "${KIND}" in
            stable) [[ "${VERSION}" != *-* ]] || refuse "${VERSION} is a pre-release" ;;
            prerelease) [[ "${VERSION}" == *-* ]] || refuse "${VERSION} is not a pre-release" ;;
            *) refuse "KIND must be stable or prerelease, not '${KIND}'" ;;
          esac
          ! git rev-parse --quiet --verify "refs/tags/v${VERSION}" >/dev/null || refuse "v${VERSION} already exists"
          norm() { local x y z; IFS=. read -r x y z <<<"$1"; echo "$((10#${x})).$((10#${y})).$((10#${z}))"; }
          base="${VERSION}"
          if [ -n "${GIVEN}" ]; then
            allowed=("${GIVEN}")
          else
            allowed=()
            if [ -n "${latest}" ]; then
              latest="$(norm "${latest}")"
              IFS=. read -r x y z <<<"${latest}"
              allowed=("$((x + 1)).0.0" "${x}.$((y + 1)).0" "${x}.${y}.$((z + 1))")
            fi
            develop="$(scripts/workspace-version.sh)"
            develop="$(norm "${develop%%-*}")"
            if [ -z "${latest}" ] || [ "$(printf '%s\n' "${latest}" "${develop}" | sort -V | tail -n 1)" != "${latest}" ]; then
              allowed+=("${develop}")
            fi
            if [ "${KIND}" = prerelease ]; then
              [[ "${VERSION}" =~ ^([0-9.]+)-dev\.[1-9][0-9]*$ ]] || refuse "${VERSION} is not X.Y.Z-dev.N"
              base="${BASH_REMATCH[1]}"
            fi
          fi
          for a in "${allowed[@]}"; do
            [ "${a}" != "${base}" ] || exit 0
          done
          refuse "${VERSION} is not a version this run may release (${allowed[*]})"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Apply the plan's edits
        env:
          PATCH: ${{ runner.temp }}/release/release.patch
          ALLOWED: 'Cargo\.toml|Cargo\.lock|fuzz/Cargo\.lock'
        # The same step in prepare and pretag, each with its own list (the version and the lockfiles: .config/release.toml's prerelease list, which Release checks the tag against).
        run: |
          set -euo pipefail
          # plan builds code, so its patch is checked here, with git alone, before the token is
          # minted: every entry must change the text of an existing regular file whose whole
          # path is on ALLOWED. No file added, deleted, renamed or copied, no mode or type change
          # (a symlink or gitlink), no binary patch; anything else fails. What those files now
          # say is not judged here.
          tab=$'\t'
          refuse() { echo "::error::$1"; exit 1; }
          ! grep -qE '^(GIT binary patch|Binary files .* differ)$' "${PATCH}" || refuse "the patch holds a binary change"
          tr -d '\000' < "${PATCH}" | cmp -s - "${PATCH}" || refuse "the patch holds a NUL byte"
          # Before applying: one "added<TAB>deleted<TAB>path" line per entry and no summary line
          # (create, delete, rename, copy, mode change, rewrite); "-" counts mean a binary entry.
          stat="$(git apply --numstat --summary "${PATCH}")"
          bad="$(grep -vxE "[0-9]+${tab}[0-9]+${tab}(${ALLOWED})" <<<"${stat}" || true)"
          [ -n "${stat}" ] && [ -z "${bad}" ] || refuse "unexpected changes: ${bad:-none}"
          git apply --index "${PATCH}"
          # After: each staged entry modifies a regular file, mode 100644 before and after.
          staged="$(git diff --cached --raw --no-renames --no-abbrev)"
          bad="$(grep -vxE ":100644 100644 [0-9a-f]{40} [0-9a-f]{40} M${tab}(${ALLOWED})" <<<"${staged}" || true)"
          [ -n "${staged}" ] && [ -z "${bad}" ] || refuse "unexpected changes: ${bad:-none}"
          git diff --cached --stat
      # Minted after the checks above; nothing in this job builds or runs code from the tree but
      # scripts/ci-git.sh.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit and tag
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT: ${{ steps.bot.outputs.app-slug }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          scripts/ci-git.sh identity "${BOT}"
          git -c core.hooksPath=/dev/null commit -am "release: ${VERSION}"
          git -c core.hooksPath=/dev/null tag -a "v${VERSION}" -m "v${VERSION}"
          scripts/ci-git.sh push-tag "v${VERSION}"
          echo "### Tagged v${VERSION} (pre-release, on top of develop)" >> "${GITHUB_STEP_SUMMARY}"

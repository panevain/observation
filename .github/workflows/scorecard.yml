name: Scorecard

on:
  # Scorecard only analyses (and publishes for) the repository's default
  # branch. Listen on both long-lived branches and let the job skip whichever
  # one isn't the default, so the badge keeps working if the default changes.
  push:
    branches: [main, develop]
  schedule:
    - cron: "23 6 * * 3"
  branch_protection_rule:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    # Scheduled, branch-protection and manual runs use the default branch;
    # pushes only count when they land on it.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Upload results to the code-scanning dashboard.
      security-events: write # upload SARIF to code scanning
      # Publish results to the OpenSSF REST API / badge (OIDC).
      id-token: write # OIDC token to publish results
      # Read access the action recommends for checks that use the API.
      contents: read
      actions: read # workflow checks
      issues: read # branch-protection / issue checks
      pull-requests: read # code-review checks
      checks: read # CI-tests checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard

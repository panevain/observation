name: Pins

# Weekly bump of the pins Dependabot can't move (scripts/bump-pins.py): the tools in mise.toml
# and mise.ci.toml (`mise upgrade --bump`, with their lockfiles), fnox, the CI mise version,
# Overpass in the Dockerfile and the Rust toolchain (Dependabot moves the fuzz nightly). Each
# release must be a week old first, as with Dependabot's cooldown. Opens one PR into develop
# (or updates it), from its own branch chore/pin-bumps. When every bump is a patch update
# (calendar versions such as mise's count as patches), the PR merges itself once its checks
# pass, as Dependabot's patch updates do; otherwise it waits for a person. Label it `hold` to
# keep it from merging itself.
on:
  schedule:
    # Monday update window, after Dependabot's runs (05:00-05:15).
    - cron: "30 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  MISE_ENV: ci

jobs:
  bump:
    name: bump pins
    runs-on: ubuntu-24.04
    # `mise run lock` downloads every locked artifact on every platform to check its provenance.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      automerge: ${{ steps.bump.outputs.automerge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise upgrades its tools and refreshes both lockfiles.
      - uses: $/.github/actions/setup-mise
        with:
          cache: false
      # The sync check after the bump is an xtask command. xtask is built first, with the
      # toolchain pinned before the bump (which may move it), and uncached like the rest of
      # this job.
      - uses: $/.github/actions/setup-rust
      - name: Build xtask
        id: xtask
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path xtask/Cargo.toml --target-dir "${RUNNER_TEMP}/xtask"
          echo "bin=${RUNNER_TEMP}/xtask/debug/xtask" >> "${GITHUB_OUTPUT}"
      - name: Bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
          XTASK: ${{ steps.xtask.outputs.bin }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/pins"
          mkdir -p "${out}"
          python3 scripts/bump-pins.py --summary "${out}/summary.md" --automerge "${out}/automerge"
          if git diff --quiet; then
            echo "Nothing to bump." >> "${GITHUB_STEP_SUMMARY}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mise run lock
          "${XTASK}" sync --repo .
          git diff --binary > "${out}/pins.patch"
          {
            echo "Pins that Dependabot does not cover, bumped by the Pins workflow (scripts/bump-pins.py):"
            echo
            cat "${out}/summary.md"
            echo
            echo "mise.lock and mise.ci.lock hold the new checksums (and provenance, where published); Overpass is hashed from its tarball. A Rust bump can bring new clippy lints; trunk, cargo-chef, cargo-auditable and Overpass bumps are exercised by the docker and image (full build) checks."
            echo
            if [ "$(cat "${out}/automerge")" = true ]; then
              echo "Every bump is a patch update, so this PR merges itself once its checks pass (label it \`hold\` to stop that)."
            else
              echo "Not every bump is a patch update, so this PR waits for a person to merge it."
            fi
          } > "${out}/body.md"
          cat "${out}/body.md" >> "${GITHUB_STEP_SUMMARY}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "automerge=$(cat "${out}/automerge")" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bump.outputs.changed == 'true'
        with:
          name: pins
          path: |
            ${{ runner.temp }}/pins/pins.patch
            ${{ runner.temp }}/pins/body.md
          if-no-files-found: error
          retention-days: 7

  pr:
    name: open pins PR
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pins
          path: ${{ runner.temp }}/pins
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT: ${{ steps.bot.outputs.app-slug }}
          AUTOMERGE: ${{ needs.bump.outputs.automerge }}
        run: |
          set -euo pipefail
          branch="chore/pin-bumps"
          git switch -c "${branch}"
          git apply --index "${RUNNER_TEMP}/pins/pins.patch"
          scripts/ci-git.sh identity "${BOT}"
          git -c core.hooksPath=/dev/null commit -m "Bump pinned tools" -m "$(sed -n '3,$p' "${RUNNER_TEMP}/pins/body.md")"
          # The branch is this workflow's own, so each run replaces it.
          scripts/ci-git.sh push-force "${branch}"
          if ! gh pr create --base develop --head "${branch}" --title "Bump pinned tools" \
            --body-file "${RUNNER_TEMP}/pins/body.md"; then
            gh pr edit "${branch}" --body-file "${RUNNER_TEMP}/pins/body.md"
          fi
          # Patch updates only merge themselves, and not when labelled hold. Auto-merge outlives
          # the force-push above, so it is switched off again when this week's bumps need a person.
          # --match-head-commit: only the commit pushed above is merged.
          state="$(gh pr view "${branch}" --json autoMergeRequest,labels)"
          if [ "${AUTOMERGE}" = true ] && ! jq -e '.labels | any(.name == "hold")' <<<"${state}" >/dev/null; then
            gh pr merge "${branch}" --auto --squash --match-head-commit "$(git rev-parse HEAD)"
            echo "Auto-merge enabled." >> "${GITHUB_STEP_SUMMARY}"
          elif jq -e '.autoMergeRequest' <<<"${state}" >/dev/null; then
            gh pr merge "${branch}" --disable-auto
            echo "Auto-merge disabled: not every bump is a patch update, or the PR is labelled hold." >> "${GITHUB_STEP_SUMMARY}"
          fi

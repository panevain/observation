name: Prune images

# Keeps `devel`, `latest` and every X.Y.Z (or X.Y.Z-pre) tag of the container images
# (observation and observation-regions) and deletes any other tagged version; attestation tags
# stay while their image exists, and untagged versions are never touched
# (scripts/prune-images.sh). Superseded `devel` builds therefore stay as untagged versions.
#
# Scheduled and workflow_run runs only delete when the repository variable PRUNE_IMAGES is
# `true`; otherwise they log what they would delete. Run it manually once and check the list
# before setting the variable.
on:
  schedule:
    # Weekly health checks, Sundays, last (it also runs after every Release).
    - cron: "0 9 * * 0"
  workflow_run:
    workflows: [Release]
    types: [completed]
    # (successful runs only, see the job condition)
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting it
        type: boolean
        default: true

# Serialises prune runs; the script also refuses to run while a Release is in progress.
concurrency:
  group: prune-images
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    name: prune image tags (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: [observation, observation-regions]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read # check out scripts/prune-images.sh
      packages: write # delete package versions
      actions: read # list in-progress Release runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete unwanted tagged versions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PACKAGE: ${{ matrix.package }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || (github.event_name != 'workflow_dispatch' && vars.PRUNE_IMAGES != 'true') }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN}" = true ]; then args=(--dry-run); fi
          scripts/prune-images.sh "${PACKAGE}" "${args[@]}"

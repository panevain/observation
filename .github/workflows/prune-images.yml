name: Prune images

# Keeps `devel`, `latest` and every X.Y.Z (or X.Y.Z-pre) tag of the container
# image, and deletes any other tagged version (old edge, main, X.Y and sha-*
# tags).
#
# `sha256-<digest>` tags are the registry's fallback for the build attestation
# of image <digest>. They are kept while that image still exists and deleted
# once it is gone (for example after `devel` moved on and the old image became
# untagged and was removed), because nothing can pull or verify it any more.
#
# Untagged versions are never touched: the SBOM and provenance attestations
# are untagged children of a tagged image index, and deleting them breaks
# `docker pull` and attestation verification. Superseded `devel` builds
# therefore stay as untagged versions.
#
# Scheduled and workflow_run runs only delete when the repository variable
# PRUNE_IMAGES is `true`; otherwise they log what they would delete. Run it
# manually once and check the list before setting the variable.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_run:
    workflows: [Release]
    types: [completed]
    # (successful runs only, see the job condition)
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting it
        type: boolean
        default: true

# Serialises prune runs; the job also refuses to run while a Release is in
# progress.
concurrency:
  group: prune-images
  cancel-in-progress: false

permissions: {}

env:
  PACKAGE: observation
  KEEP_REGEX: '^(devel|latest|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'
  ATTESTATION_REGEX: '^sha256-([0-9a-f]{64})(\.[a-z]+)?$'

jobs:
  prune:
    name: prune image tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      packages: write # delete package versions
      actions: read # list in-progress Release runs
    steps:
      - name: Delete unwanted tagged versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || (github.event_name != 'workflow_dispatch' && vars.PRUNE_IMAGES != 'true') }}
        run: |
          set -euo pipefail
          busy=$(gh run list --repo "$REPO" --workflow release.yml --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != 0 ]; then
            echo "A Release run is in progress; skipping."
            exit 0
          fi
          case "$(gh api "users/$OWNER" --jq .type)" in
            Organization) base="orgs/$OWNER" ;;
            *) base="users/$OWNER" ;;
          esac
          url="$base/packages/container/$PACKAGE/versions"

          gh api --paginate "$url?per_page=100" --jq '.[]' | jq -s '.' >"$RUNNER_TEMP/versions.json"
          # Version names are image digests (sha256:...).
          names=$(jq -r '.[].name' "$RUNNER_TEMP/versions.json")

          # id <TAB> comma-separated tags, only for versions that have a tag
          # and none of whose tags is on the keep list. An attestation tag is
          # on the keep list only while the image it refers to still exists.
          doomed=$(jq -r '.[] | select((.metadata.container.tags | length) > 0) | [.id, (.metadata.container.tags | join(","))] | @tsv' "$RUNNER_TEMP/versions.json" |
            while IFS=$'\t' read -r id tags; do
              keep=false
              IFS=, read -ra arr <<<"$tags"
              for t in "${arr[@]}"; do
                if [[ "$t" =~ $KEEP_REGEX ]]; then
                  keep=true
                elif [[ "$t" =~ $ATTESTATION_REGEX ]] && grep -qxF "sha256:${BASH_REMATCH[1]}" <<<"$names"; then
                  keep=true
                fi
              done
              if [ "$keep" = false ]; then printf '%s\t%s\n' "$id" "$tags"; fi
            done)

          if [ -z "$doomed" ]; then
            echo "Nothing to delete."
            exit 0
          fi
          failed=0
          while IFS=$'\t' read -r id tags; do
            if [ "$DRY_RUN" = true ]; then
              echo "Would delete version $id (tags: $tags)"
            else
              echo "Deleting version $id (tags: $tags)"
              gh api -X DELETE "$url/$id" || { echo "::warning::could not delete version $id"; failed=1; }
            fi
          done <<<"$doomed"
          exit "$failed"

# Dependabot version updates.
#
# NOTE: this file only configures *version* updates. Dependabot *security*
# updates (automatic PRs for vulnerable dependencies) and Dependabot alerts
# must be enabled in the repository settings:
#   Settings -> Advanced Security -> Dependabot alerts / Dependabot security updates
# (also enable "Private vulnerability reporting" and "Secret scanning" there).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    # Git-flow: dependency updates integrate via develop.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    ignore:
      # glam types cross the observation-core <-> Bevy boundary, so glam must
      # stay on the exact minor version Bevy uses (0.x minors are breaking).
      # Bump it together with Bevy, by hand.
      - dependency-name: glam
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Fuzz targets (separate workspace with its own lockfile; see fuzz/README.md).
  - package-ecosystem: cargo
    directory: /fuzz
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fuzz"
    ignore:
      # Same rule as the main workspace: glam moves with Bevy.
      - dependency-name: glam
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      fuzz-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    # Git-flow: dependency updates integrate via develop.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    # Git-flow: dependency updates integrate via develop.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker"
    ignore:
      # The builder image's Rust version must match rust-toolchain.toml (and
      # Bevy's MSRV); bump both together, by hand. Patch/digest updates still flow.
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

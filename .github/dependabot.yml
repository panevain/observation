# Dependabot version and security updates.
#
# Every update targets develop, the default branch. No `target-branch` is set: security
# updates always go to the default branch, and with a target-branch set they would also
# ignore this file's groups and commit prefixes. Security updates and alerts are enabled in
# Settings -> Advanced Security. A fix for the latest *release* reaches main through a hotfix
# (release-watch.yml and hotfix.yml), since Dependabot only looks at the default branch.
#
# Times are the Monday update window (05:00-05:15 UTC; Docker digests daily at 05:00), before
# Pins (05:30) and the 06:00 auto-merge sweep.
#
# Patch and minor updates come in separate groups: Dependabot auto-merge
# (dependabot-automerge.yml) merges patch updates and base image digest refreshes once their
# checks pass, so a patch group never waits on a minor update that needs a person.
version: 2
updates:
  # Both Cargo workspaces: the root one and the fuzz targets (fuzz/, its own lockfile; see
  # fuzz/README.md). One entry, so a crate both use is bumped in one PR across both lockfiles.
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
      day: monday
      time: "05:05"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    ignore:
      # glam types cross the observation-core <-> Bevy boundary, so glam must
      # stay on the exact minor version Bevy uses (0.x minors are breaking).
      # Bump it together with Bevy, by hand.
      - dependency-name: glam
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-patch:
        update-types: [patch]
      cargo-minor:
        update-types: [minor]
      cargo-major:
        update-types: [major]
      # One pull request for every crate an advisory fix needs.
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # The workflows, and the composite actions they share (.github/actions/), which Dependabot
  # does not look at from the root directory alone.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions-patch:
        update-types: [patch]
      actions-minor:
        update-types: [minor]

  # Daily, with no cooldown: base images have no Dependabot security updates, so their digest
  # refreshes are how Debian security fixes reach develop. (Cooldown would also only apply to
  # the Docker Hub images; gcr.io publishes no dates.)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
    ignore:
      # Digests only. The builder image's Rust version must match rust-toolchain.toml (and
      # Bevy's MSRV), and the build-tools stage's mise is the CI mise
      # (.github/actions/setup-mise): the Pins workflow (scripts/bump-pins.py) moves those tags
      # with the files that repeat them, and mise run sync checks they agree. Debian and
      # distroless are pinned to a release name (trixie-slim, nonroot), which has no versions.
      # A new base image with a versioned tag would need its own rule here.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      # Every image's digest refresh in one PR, which auto-merge takes once green.
      docker-digests:
        patterns: ["*"]

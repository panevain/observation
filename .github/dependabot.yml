# Dependabot version and security updates.
#
# Every update targets develop, the default branch. No `target-branch` is set: security
# updates always go to the default branch, and with a target-branch set they would also
# ignore this file's groups and commit prefixes. Security updates and alerts are enabled in
# Settings -> Advanced Security. A fix for the latest *release* reaches main through a hotfix
# (release-watch.yml and hotfix.yml), since Dependabot only looks at the default branch.
#
# Times are the Monday update window (05:00-05:15 UTC; Docker digests daily at 05:00), before
# Pins (05:30) and the 06:00 auto-merge sweep.
#
# Patch and minor updates come in separate groups: Dependabot auto-merge
# (dependabot-automerge.yml) merges patch updates and base image digest refreshes once their
# checks pass, so a patch group never waits on a minor update that needs a person.
version: 2
updates:
  # Both Cargo workspaces: the root one and the fuzz targets (fuzz/, its own lockfile; see
  # fuzz/README.md). One entry, so a crate both use is bumped in one PR across both lockfiles.
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
      day: monday
      time: "05:05"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates. This covers only the crate being bumped: the
    # cargo-cooldown check (security.yml, .config/cargo-cooldown.toml) holds every crate version
    # a PR adds to the lockfiles, indirect ones included, to the same 7 days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    ignore:
      # glam types cross the observation-core <-> Bevy boundary, so glam must
      # stay on the exact minor version Bevy uses (0.x minors are breaking).
      # Bump it together with Bevy, by hand.
      - dependency-name: glam
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-patch:
        update-types: [patch]
      cargo-minor:
        update-types: [minor]
      cargo-major:
        update-types: [major]
      # One pull request for every crate an advisory fix needs.
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # The workflows, and the composite actions they share (.github/actions/), which Dependabot
  # does not look at from the root directory alone.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions-patch:
        update-types: [patch]
      actions-minor:
        update-types: [minor]

  # The browser smoke test's one dependency (playwright-core, tests/browser); it ships nothing.
  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "test"
    groups:
      npm:
        patterns: ["*"]

  # The fuzz targets' dated nightly (fuzz/rust-toolchain.toml, set nowhere else). The root
  # toolchain is mise's too (mise.lock), so the Pins workflow bumps it and relocks.
  - package-ecosystem: rust-toolchain
    directory: /fuzz
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: "rust"

  # Daily, with no cooldown: base images have no Dependabot security updates, so their digest
  # refreshes are how Debian security fixes reach develop. (Cooldown would also only apply to
  # the Docker Hub images; gcr.io publishes no dates.)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
    ignore:
      # Digests only for the build-tools stage's mise, which is the CI mise
      # (.github/actions/setup-mise): the Pins workflow (scripts/bump-pins.py) moves its tag with
      # the files that repeat it, and mise run sync checks they agree. The rust builder image's
      # tag moves freely (the build installs rust-toolchain.toml's toolchain); Debian and
      # distroless are pinned to a release name (trixie-slim, nonroot), which has no versions.
      - dependency-name: "*jdx/mise"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      # A new rust image tag on its own, so a minor bump that needs a person does not hold up
      # the digest refreshes.
      rust-image:
        patterns: ["rust"]
      # Every other image's digest refresh in one PR, which auto-merge takes once green.
      docker-digests:
        patterns: ["*"]
        exclude-patterns: ["rust"]

# Dependabot version updates.
#
# NOTE: this file only configures *version* updates. Dependabot *security*
# updates (automatic PRs for vulnerable dependencies) and Dependabot alerts
# must be enabled in the repository settings:
#   Settings -> Advanced Security -> Dependabot alerts / Dependabot security updates
# (also enable "Private vulnerability reporting" and "Secret scanning" there).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies]
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies]
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies]
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

# Dependabot version and security updates.
#
# Every update targets develop, the default branch. No `target-branch` is set: security
# updates always go to the default branch, and with a target-branch set they would also
# ignore this file's groups and commit prefixes. Security updates and alerts are enabled in
# Settings -> Advanced Security. A fix for the latest *release* reaches main through a hotfix
# (release-watch.yml and hotfix.yml), since Dependabot only looks at the default branch.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    ignore:
      # glam types cross the observation-core <-> Bevy boundary, so glam must
      # stay on the exact minor version Bevy uses (0.x minors are breaking).
      # Bump it together with Bevy, by hand.
      - dependency-name: glam
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
      # One pull request for every crate an advisory fix needs.
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # Fuzz targets (separate workspace with its own lockfile; see fuzz/README.md).
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fuzz"
    ignore:
      # Same rule as the main workspace: glam moves with Bevy.
      - dependency-name: glam
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      fuzz-deps:
        patterns: ["*"]
      fuzz-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it (supply-chain hygiene);
    # does not delay Dependabot *security* updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Daily, with no cooldown: base images have no Dependabot security updates, so their digest
  # refreshes are how Debian security fixes reach develop. (Cooldown would also only apply to
  # the Docker Hub images; gcr.io publishes no dates.)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
    ignore:
      # The builder image's Rust version must match rust-toolchain.toml (and Bevy's MSRV).
      # The Pins workflow (scripts/bump-pins.sh) moves rust-toolchain.toml, Cargo.toml, the
      # Dockerfile tag and mise.lock together, and mise run sync checks they agree. Only
      # digest updates come from Dependabot.
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # Hash-pinned requirements for tools run from PyPI in CI (zizmor).
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

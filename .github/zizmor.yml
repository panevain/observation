# zizmor configuration (see .github/workflows/security.yml).
rules:
  cache-poisoning:
    ignore:
      # ci.yml publishes nothing but a 14-day artifact: images and tags come from release.yml,
      # which uses its own cache scope. rust-cache, mise-action and the Docker GHA cache
      # (.github/actions/build-image) only save from develop; pull request runs only read them.
      # Revisit if a publish or deploy step is ever added to ci.yml.
      - ci.yml
  dangerous-triggers:
    ignore:
      # workflow_run fires only after our own Release workflow, checks out the default branch
      # (no PR code, no persisted credentials), and needs no secrets beyond GITHUB_TOKEN with
      # packages: write.
      - prune-images.yml

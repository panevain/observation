[package]
name = "xtask"
description = "Observation's repository tooling: `cargo xtask <command>` (see .cargo/config.toml)"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1", features = ["preserve_order"] }
semver = "1.0"
# Measures the wasm modules' gzip size (wasm-budget): a bump of flate2 or miniz_oxide can move
# those sizes, so check the headroom in the `wasm (trunk build)` job's output with it.
flate2 = "1.1"

[dev-dependencies]
tempfile = "3.27"

# The scripts against the built binary, while both exist (see the file). Outside tests/, whose
# fixture trees hold .rs files that are data, not test targets.
[[test]]
name = "release_version"
path = "parity/release_version.rs"

# Each KIND of `release unexpected-files` on the command line, through the built binary.
[[test]]
name = "release_files"
path = "parity/release_files.rs"

# Dependencies with no user yet: the commands that need them arrive in later changes. Remove in
# sweep (each entry goes once its first user lands). The root Cargo.toml has the same list for
# the root workspace.
[package.metadata.cargo-shear]
ignored = []

[lints]
workspace = true

# Its own workspace, like fuzz/: these dependencies are tools that ship in no image, so they stay
# out of the root Cargo.lock (which Release's cargo-deny gate and Release watch's cargo-audit act
# on). The root rust-toolchain.toml applies.
[workspace]
members = ["."]

# The root workspace's lints.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

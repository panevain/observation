pgrade to an unaffected version: time 0.2.23 or greater or the 0.3 series.\\n\\n### Workarounds\\n\\nA possible workaround for crates affected through the transitive dependency in `chrono`, is to avoid using the default `oldtime` feature dependency of the `chrono` crate by disabling its `default-features` and manually specifying the required features instead.\\n\\n#### Examples:\\n\\n`Cargo.toml`:  \\n\\n```toml\\nchrono = { version = \\\"0.4\\\", default-features = false, features = [\\\"serde\\\"] }\\n```\\n\\n```toml\\nchrono = { version = \\\"0.4.22\\\", default-features = false, features = [\\\"clock\\\"] }\\n```\\n\\nCommandline:  \\n\\n```bash\\ncargo add chrono --no-default-features -F clock\\n```\\n\\nSources:  \\n - [chronotope/chrono#602 (comment)](https://github.com/chronotope/chrono/issues/602#issuecomment-1242149249)  \\n - [vityafx/serde-aux#21](https://github.com/vityafx/serde-aux/issues/21)\", \"date\": \"2020-11-18\", \"aliases\": [\"CVE-2020-26235\", \"GHSA-wcg3-cvx6-7396\"], \"related\": [], \"collection\": \"crates\", \"categories\": [\"code-execution\", \"memory-corruption\"], \"keywords\": [\"segfault\"], \"cvss\": \"CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H\", \"informational\": null, \"references\": [], \"source\": null, \"url\": \"https://github.com/time-rs/time/issues/293\", \"withdrawn\": null, \"license\": \"CC0-1.0\", \"expect-deleted\": false}, \"versions\": {\"patched\": [\">=0.2.23\"], \"unaffected\": [\"=0.2.0\", \"=0.2.1\", \"=0.2.2\", \"=0.2.3\", \"=0.2.4\", \"=0.2.5\", \"=0.2.6\"]}, \"affected\": {\"arch\": [], \"os\": [\"linux\", \"redox\", \"solaris\", \"android\", \"ios\", \"macos\", \"netbsd\", \"openbsd\", \"freebsd\"], \"functions\": {\"time::OffsetDateTime::now_local\": [\"<0.2.23\"], \"time::OffsetDateTime::try_now_local\": [\"<0.2.23\"], \"time::UtcOffset::current_local_offset\": [\"<0.2.23\"], \"time::UtcOffset::local_offset_at\": [\"<0.2.23\"], \"time::UtcOffset::try_current_local_offset\": [\"<0.2.23\"], \"time::UtcOffset::try_local_offset_at\": [\"<0.2.23\"], \"time::at\": [\"^0.1\"], \"time::at_utc\": [\"^0.1\"], \"time::now\": [\"^0.1\"]}}, \"package\": {\"name\": \"time\", \"version\": \"0.1.43\", \"source\": \"registry+https://github.com/rust-lang/crates.io-index\", \"checksum\": null, \"replace\": null}}, {\"advisory\": {\"id\": \"RUSTSEC-2021-0003\", \"package\": \"smallvec\", \"title\": \"Buffer overflow in SmallVec::insert_many\", \"description\": \"A bug in the `SmallVec::insert_many` method caused it to allocate a buffer that was smaller than needed.  It then wrote past the end of the buffer, causing a buffer overflow and memory corruption on the heap.\\n\\nThis bug was only triggered if the iterator passed to `insert_many` yielded more items than the lower bound returned from its `size_hint` method.\\n \\nThe flaw was corrected in smallvec 0.6.14 and 1.6.1, by ensuring that additional space is always reserved for each item inserted.  The fix also simplified the implementation of `insert_many` to use less unsafe code, so it is easier to verify its correctness.\\n\\nThank you to Yechan Bae ([@Qwaz](https://github.com/Qwaz)) and the Rust group at Georgia Tech\\u2019s SSLab for finding and reporting this bug.\", \"date\": \"2021-01-08\", \"aliases\": [\"CVE-2021-25900\", \"GHSA-43w2-9j62-hq99\"], \"related\": [], \"collection\": \"crates\", \"categories\": [\"memory-corruption\"], \"keywords\": [\"buffer-overflow\", \"heap-overflow\", \"unsound\"], \"cvss\": \"CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H\", \"informational\": null, \"references\": [], \"source\": null, \"url\": \"https://github.com/servo/rust-smallvec/issues/252\", \"withdrawn\": null, \"license\": \"CC0-1.0\", \"expect-deleted\": false}, \"versions\": {\"patched\": [\">=0.6.14, <1.0.0\", \">=1.6.1\"], \"unaffected\": [\"<0.6.3\"]}, \"affected\": {\"arch\": [], \"os\": [], \"functions\": {\"smallvec::SmallVec::insert_many\": [\">=0.6.3, <0.6.14\", \">=1.0.0, <1.6.1\"]}}, \"package\": {\"name\": \"smallvec\", \"version\": \"1.6.0\", \"source\": \"registry+https://github.com/rust-lang/crates.io-index\", \"checksum\": null, \"replace\": null}}, {\"advisory\": {\"id\": \"RUSTSEC-2022-0013\", \"package\": \"regex\", \"title\": \"Regexes with large repetitions on empty sub-expressions take a very long time to parse\", \"description\": \"The Rust Security Response WG was notified that the `regex` crate did not\\nproperly limit the complexity of the regular expressions (regex) it parses. An\\nattacker could use this security issue to perform a denial of service, by\\nsending a specially crafted regex to a service accepting untrusted regexes. No\\nknown vulnerability is present when parsing untrusted input with trusted\\nregexes.\\n\\nThis issue has been assigned CVE-2022-24713. The severity of this vulnerability\\nis \\\"high\\\" when the `regex` crate is used to parse untrusted regexes. Other uses\\nof the `regex` crate are not affected by this vulnerability.\\n\\n## Overview\\n\\nThe `regex` crate features built-in mitigations to prevent denial of service\\nattacks caused by untrusted regexes, or untrusted input matched by trusted\\nregexes. Those (tunable) mitigations already provide sane defaults to prevent\\nattacks. This guarantee is documented and it's considered part of the crate's\\nAPI.\\n\\nUnfortunately a bug was discovered in the mitigations designed to prevent\\nuntrusted regexes to take an arbitrary amount of time during parsing, and it's\\npossible to craft regexes that bypass such mitigations. This makes it possible\\nto perform denial of service attacks by sending specially crafted regexes to\\nservices accepting user-controlled, untrusted regexes.\\n\\n## Affected versions\\n\\nAll versions of the `regex` crate before or equal to 1.5.4 are affected by this\\nissue. The fix is include starting from  `regex` 1.5.5.\\n\\n## Mitigations\\n\\nWe recommend everyone accepting user-controlled regexes to upgrade immediately\\nto the latest version of the `regex` crate.\\n\\nUnfortunately there is no fixed set of problematic regexes, as there are\\npractically infinite regexes that could be crafted to exploit this\\nvulnerability. Because of this, we do not recommend denying known problematic\\nregexes.\\n\\n## Acknowledgements\\n\\nWe want to thank Addison Crump for responsibly disclosing this to us according\\nto the [Rust security policy][1], and for helping review the fix.\\n\\nWe also want to thank Andrew Gallant for developing the fix, and Pietro Albini\\nfor coordinating the disclosure and writing this advisory.\\n\\n[1]: https://www.rust-lang.org/policies/security\", \"date\": \"2022-03-08\", \"aliases\": [\"CVE-2022-24713\", \"GHSA-m5pq-gvj9-9vr8\"], \"related\": [], \"collection\": \"crates\", \"categories\": [\"denial-of-service\"], \"keywords\": [], \"cvss\": \"CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H\", \"informational\": null, \"references\": [], \"source\": null, \"url\": \"https://groups.google.com/g/rustlang-security-announcements/c/NcNNL1Jq7Yw\", \"withdrawn\": null, \"license\": \"CC0-1.0\", \"expect-deleted\": false}, \"versions\": {\"patched\": [\">=1.5.5\"], \"unaffected\": []}, \"affected\": null, \"package\": {\"name\": \"regex\", \"version\": \"1.5.4\", \"source\": \"registry+https://github.com/rust-lang/crates.io-index\", \"checksum\": null, \"replace\": null}}]}, \"warnings\": {}}", "code" = 0 },

 0.2.23 or greater or the 0.3 series.\\n\\n### Workarounds\\n\\nA possible workaround for crates affected through the transitive dependency in `chrono`, is to avoid using the default `oldtime` feature dependency of the `chrono` crate by disabling its `default-features` and manually specifying the required features instead.\\n\\n#### Examples:\\n\\n`Cargo.toml`:  \\n\\n```toml\\nchrono = { version = \\\"0.4\\\", default-features = false, features = [\\\"serde\\\"] }\\n```\\n\\n```toml\\nchrono = { version = \\\"0.4.22\\\", default-features = false, features = [\\\"clock\\\"] }\\n```\\n\\nCommandline:  \\n\\n```bash\\ncargo add chrono --no-default-features -F clock\\n```\\n\\nSources:  \\n - [chronotope/chrono#602 (comment)](https://github.com/chronotope/chrono/issues/602#issuecomment-1242149249)  \\n - [vityafx/serde-aux#21](https://github.com/vityafx/serde-aux/issues/21)\",\"date\":\"2020-11-18\",\"aliases\":[\"CVE-2020-26235\",\"GHSA-wcg3-cvx6-7396\"],\"related\":[],\"collection\":\"crates\",\"categories\":[\"code-execution\",\"memory-corruption\"],\"keywords\":[\"segfault\"],\"cvss\":\"CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H\",\"informational\":null,\"references\":[],\"source\":null,\"url\":\"https://github.com/time-rs/time/issues/293\",\"withdrawn\":null,\"license\":\"CC0-1.0\",\"expect-deleted\":false},\"versions\":{\"patched\":[\">=0.2.23\"],\"unaffected\":[\"=0.2.0\",\"=0.2.1\",\"=0.2.2\",\"=0.2.3\",\"=0.2.4\",\"=0.2.5\",\"=0.2.6\"]},\"affected\":{\"arch\":[],\"os\":[\"linux\",\"redox\",\"solaris\",\"android\",\"ios\",\"macos\",\"netbsd\",\"openbsd\",\"freebsd\"],\"functions\":{\"time::OffsetDateTime::now_local\":[\"<0.2.23\"],\"time::OffsetDateTime::try_now_local\":[\"<0.2.23\"],\"time::UtcOffset::current_local_offset\":[\"<0.2.23\"],\"time::UtcOffset::local_offset_at\":[\"<0.2.23\"],\"time::UtcOffset::try_current_local_offset\":[\"<0.2.23\"],\"time::UtcOffset::try_local_offset_at\":[\"<0.2.23\"],\"time::at\":[\"^0.1\"],\"time::at_utc\":[\"^0.1\"],\"time
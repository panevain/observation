cted versions\\n\\nAll versions of the `regex` crate before or equal to 1.5.4 are affected by this\\nissue. The fix is include starting from  `regex` 1.5.5.\\n\\n## Mitigations\\n\\nWe recommend everyone accepting user-controlled regexes to upgrade immediately\\nto the latest version of the `regex` crate.\\n\\nUnfortunately there is no fixed set of problematic regexes, as there are\\npractically infinite regexes that could be crafted to exploit this\\nvulnerability. Because of this, we do not recommend denying known problematic\\nregexes.\\n\\n## Acknowledgements\\n\\nWe want to thank Addison Crump for responsibly disclosing this to us according\\nto the [Rust security policy][1], and for helping review the fix.\\n\\nWe also want to thank Andrew Gallant for developing the fix, and Pietro Albini\\nfor coordinating the disclosure and writing this advisory.\\n\\n[1]: https://www.rust-lang.org/policies/security\", \"date\": \"2022-03-08\", \"aliases\": [\"CVE-2022-24713\", \"GHSA-m5pq-gvj9-9vr8\"], \"related\": [], \"collection\": \"crates\", \"categories\": [\"denial-of-service\"], \"keywords\": [], \"cvss\": \"CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H\", \"informational\": null, \"references\": [], \"source\": null, \"url\": \"https://groups.google.com/g/rustlang-security-announcements/c/NcNNL1Jq7Yw\", \"withdrawn\": null, \"license\": \"CC0-1.0\", \"expect-deleted\": false}, \"versions\": {\"patched\": [\">=1.5.5\"], \"unaffected\": []}, \"affected\": null, \"package\": {\"name\": \"-x\", \"version\": \"1.5.4\", \"source\": \"registry+https://github.com/rust-lang/crates.io-index\", \"checksum\": null, \"replace\": null}}, {\"advisory\": {\"id\": \"RUSTSEC-2021-0003\", \"package\": \"smallvec\", \"title\": \"Buffer overflow in SmallVec::insert_many\", \"description\": \"A bug in the `SmallVec::insert_many` method caused it to allocate a buffer that was smaller than needed.  It then wrote past the end of the buffer, causing a buffer overflow and memory corruption on
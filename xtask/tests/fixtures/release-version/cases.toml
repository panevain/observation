# Generated by gen_cases.py (see the PR that added it); captured with capture.py into golden.

[template.workspace]
"Cargo.toml" = "[workspace]\nresolver = \"3\"\nmembers = [\"crates/*\"]\nexclude = [\"fuzz\"]\n\n[workspace.package]\nversion = \"0.1.0\"\nedition = \"2024\"\npublish = false\n"
"Cargo.lock" = "# This file is automatically @generated by Cargo.\n# It is not intended for manual editing.\nversion = 4\n\n[[package]]\nname = \"a\"\nversion = \"0.1.0\"\n"
"crates/a/Cargo.toml" = "[package]\nname = \"a\"\nversion.workspace = true\nedition.workspace = true\npublish.workspace = true\n"
"crates/a/src/lib.rs" = ""
"fuzz/Cargo.toml" = "[package]\nname = \"a-fuzz\"\nversion = \"0.0.0\"\nedition = \"2024\"\npublish = false\n\n[dependencies]\na = { path = \"../crates/a\" }\n\n[workspace]\nmembers = [\".\"]\n"
"fuzz/Cargo.lock" = "# This file is automatically @generated by Cargo.\n# It is not intended for manual editing.\nversion = 4\n\n[[package]]\nname = \"a\"\nversion = \"0.1.0\"\n\n[[package]]\nname = \"a-fuzz\"\nversion = \"0.0.0\"\ndependencies = [\n \"a\",\n]\n"
"fuzz/src/lib.rs" = ""

[[case]]
name = "get: the template"
command = "get"
args = []
template = "workspace"

[[case]]
name = "get: pre-release"
command = "get"
args = []
[case.files]
"Cargo.toml" = "[workspace]\nmembers = [\"crates/*\"]\n\n[workspace.package]\nversion = \"0.2.0-dev.3\"\nedition = \"2024\"\n\n[workspace.dependencies]\n"


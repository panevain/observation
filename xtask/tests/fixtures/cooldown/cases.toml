body = '{"errors":[{"detail":"Not Found"}]}'
[case.api."nopubtime/1.0.0"]
status = 200
body = '{"version":{"num":"1.0.0","created_at":"2017-02-20T16:52:28.170219+00:00"}}'
[case.api."unindexed/2.0.0"]
status = 200
body = '{"version":{"num":"2.0.0","created_at":"2026-11-10T23:00:00-02:00"}}'
[case.audit]
json = '{"vulnerabilities":{"list":[]}}'


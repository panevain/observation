[case.lockfiles."Cargo.lock"]
base = "version = 4\n"
head = """
version = 4

[[package]]
name = "ghost"
version = "0.1.0"
source = "registry+https://github.com/rust-lang/crates.io-index"

[[package]]
name = "nopubtime"
version = "1.0.0"
source = "registry+https://github.com/rust-lang/crates.io-index"

[[package]]
name = "unindexed"
version = "2.0.0"
source = "registry+https://github.com/rust-lang/crates.io-index"
"""
[case.index.ghost]
status = 404
body = ""
[case.index.nopubtime]
status = 200
body = """{"name":"nopubtime","vers":"1.0.0"}
"""
[case.index.unindexed]
status = 404
body = ""
[case.api."ghost/0.1.0"]

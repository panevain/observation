# Scenarios for `cargo xtask cooldown`'s golden test (cooldown/golden holds what
# scripts/check-cargo-cooldown.py printed for each). Each case:
# - `lockfiles`: path -> { base, head }; a missing side is a file that does not exist there;
# - `index`: crate -> { status, body } for https://index.crates.io/<path>, `error` for a
#   failed request; `api`: "name/version" -> { status, body } for the crates.io API;
# - `audit`: cargo-audit's JSON for every lockfile at BASE (absent: cargo-audit not on PATH;
#   `audit_stderr` with an empty `audit` is a run that printed no JSON);
# - `base` (default "base", the tagged commit), `now` and `config`.
# Lockfile packages: a = crates.io registry, s = sparse crates.io, o = another registry.

[[case]]
name = "clean"
now = "2026-11-11T12:00:00Z"
config = "days = 7\nexempt = []\n"
[case.lockfiles."Cargo.lock"]
base = """
version = 4

[[package]]
name = "keep"
version = "1.0.0"
source = "registry+https://github.com/rust-lang/crates.io-index"
"""
head = """
version = 4

[[package]]
name = "keep"
version = "1.0.0"
source = "registry+https://github.com/rust-lang/crates.io-index"

[[package]]
name = "old-enough"
version = "2.1.0"
source = "sparse+https://index.crates.io/"

[[package]]
name = "by-git"
version = "0.1.0"
source = "git+https://github.com/example/by-git#0123456789abcdef"

[[package]]
name = "by-path"
version = "0.1.0"

[[package]]
name = "elsewhere"
version = "9.9.9"
source = "registry+https://example.com/index"
"""
[case.index.old-enough]
status = 200
body = """{"name":"old-enough","vers":"2.0.0","pubtime":"2026-01-01T00:00:00Z"}
{"name":"old-enough","vers":"2.1.0","pubtime":"2026-11-04T12:00:00Z"}
"""
[case.audit]
json = '{"vulnerabilities":{"found":false,"count":0,"list":[]}}'

[[case]]
name = "too new, and new lockfiles"
now = "2026-11-11T12:00:00Z"
config = "days = 7\nexempt = []\n"
[case.lockfiles."Cargo.lock"]
base = "version = 4\n"
head = """
version = 4

[[package]]
name = "fresh"
version = "1.0.1"
source = "registry+https://github.com/rust-lang/crates.io-index"
"""
[case.lockfiles."xtask/Cargo.lock"]
head = """
version = 4

[[package]]
name = "abc"
version = "0.3.0"
source = "registry+https://github.com/rust-lang/crates.io-index"

[[package]]
name = "fresh"
version = "1.0.1"
source = "registry+https://github.com/rust-lang/crates.io-index"
"""
[case.index.fresh]
status = 200
body = """{"name":"fresh","vers":"1.0.1","pubtime":"2026-11-04T12:00:00.000001Z"}
"""
[case.index.abc]
status = 200
body = """{"name":"abc","vers":"0.3.0","pubtime":"2026-11-10T23:59:59Z"}
"""
[case.audit]
json = '{"vulnerabilities":{"list":[]}}'

[[case]]
name = "exemptions"
now = "2026-11-11T12:00:00Z"
config = """days = 7
exempt = [
    { name = "pinned", version = "1.0.0", reason = "fixes #12; reviewed the diff" },
    { name = "pinned", version = "1.0.1", reason = "another version" },
    { name = "anyver", reason = "every version" },
    { name = "gone", version = "0.1.0", reason = "expired", until = 2026-11-10 },
    { name = "today", reason = "ends today", until = 2026-11-11 },
]
"""
[case.lockfiles."Cargo.lock"]
base = "version = 4\n"
head = """
version = 4

[[package]]
name = "anyver"
version = "3.0.0"
source = "registry+https://github.com/rust-lang/crates.io-index"

[[package]]
name = "gone"
version = "0.1.0"
source = "registry+https://github.com/rust-lang/crates.io-index"

[[package]]
name = "pinned"
version = "1.0.0"
source = "registry+https://github.com/rust-lang/crates.io-index"

[[package]]
name = "today"
version = "1.0.0"
source = "registry+https://github.com/rust-lang/crates.io-index"
"""
[case.index.anyver]
status = 200
body = """{"name":"anyver","vers":"3.0.0","pubtime":"2026-11-11T00:00:00Z"}
"""
[case.index.gone]
status = 200
body = """{"name":"gone","vers":"0.1.0","pubtime":"2026-11-11T00:00:00Z"}
"""
[case.index.pinned]
status = 200
body = """{"name":"pinned","vers":"1.0.0","pubtime":"2026-11-09T08:30:00Z"}
"""
[case.index.today]
status = 200
body = """{"name":"today","vers":"1.0.0","pubtime":"2026-11-11T11:00:00Z"}
"""

[[case]]
name = "security fix"
now = "2026-11-11T12:00:00Z"
config = "days = 7\nexempt = []\n"
[case.lockfiles."Cargo.lock"]
base = """
version = 4

[[package]]
name = "vuln"
version = "1.2.0"
source = "registry+https://github.com/rust-lang/crates.io-index"

[[package]]
name = "twice"
version = "0.4.0"
source = "registry+https://github.com/rust-lang/crates.io-index"
"""
head = """
version = 4

[[package]]
name = "vuln"
version = "1.2.5"
source = "registry+https://github.com/rust-lang/crates.io-index"

[[package]]
name = "twice"
version = "0.4.1"
source = "registry+https://github.com/rust-lang/crates.io-index"
"""
[case.index.vuln]
status = 200
body = """{"name":"vuln","vers":"1.2.5","pubtime":"2026-11-10T00:00:00Z"}
"""
[case.index.twice]
status = 200
body = """{"name":"twice","vers":"0.4.1","pubtime":"2026-11-10T00:00:00Z"}
"""
[case.audit]
json = '{"vulnerabilities":{"found":true,"count":3,"list":[{"advisory":{"id":"RUSTSEC-2026-0101"},"package":{"name":"vuln","version":"1.2.0"},"versions":{"patched":[">= 1.2.4, < 1.3.0", ">= 1.3.2"],"unaffected":["< 1.0.0"]}},{"advisory":{"id":"RUSTSEC-2026-0102"},"package":{"name":"twice","version":"0.4.0"},"versions":{"patched":["^0.4.1"]}},{"advisory":{"id":"RUSTSEC-2026-0103"},"package":{"name":"twice","version":"0.4.0"},"versions":{"patched":[">= 0.5.0"]}}]}}'


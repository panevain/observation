targets = ["state", "prep", "prep-pre", "hotfix", "watch"]
github_actions = "true"
differs = { "state" = "stricter", "prep" = "stricter", "prep-pre" = "stricter", "hotfix" = "message", "watch" = "stricter" }
[case.git]
"ls-remote --tags --refs origin v*" = { code = 0, stdout = "0123456789abcdef0123456789abcdef01234567\trefs/tags/v1.2.0\n" }
"fetch --quiet --depth=1 origin main" = { code = 0, stdout = "" }
"show FETCH_HEAD:Cargo.toml" = { code = 0, stdout = "[workspace]\nmembers = [\"crates/*\"]\n\n[workspace.package]\nversion = \"1.2.0\"\nedition = \"2024\"\n" }

# cargo-deny configuration (current schema; see
# https://embarkstudios.github.io/cargo-deny/). Run: mise -E ci run deny

[graph]
# Resolve dependencies for every platform we actually ship for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
all-features = false

[advisories]
# Vulnerabilities, unsound and unmaintained advisories (workspace-reachable
# ones) are always errors in the current schema. Yanked crates are errors too.
yanked = "deny"
# Keep empty. If an advisory truly cannot be fixed yet, add an entry WITH a reason and an
# expiry date in osv-scanner.toml (cargo-deny 0.20 has no expiry of its own), e.g.
#   { id = "RUSTSEC-0000-0000", reason = "no fix upstream; tracked in #123" }
# and mirror the ID in .cargo/audit.toml and osv-scanner.toml (`mise run sync` checks the
# three lists agree; osv-scanner.toml is what OpenSSF Scorecard reads).
ignore = []
# An ignore that no longer matches anything (for example after the upgrade that fixes it)
# fails the check, so it gets removed rather than lingering.
unused-ignored-advisory = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "OFL-1.1",              # Bevy's bundled fonts
    "CDLA-Permissive-2.0",  # webpki-roots
    "MIT-0",                # encase (Bevy shader data layout)
    "Ubuntu-font-1.0",      # epaint_default_fonts (egui UI font)
]
confidence-threshold = 0.9
# The allow-list is deliberately a superset of what is in use today (Bevy / rustls
# stacks need the rarer entries), so don't warn about unused entries.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are `publish = false`; do not require them to carry an
# allow-listed licence expression.
ignore = true

[bans]
# Bevy's tree pulls many duplicate versions; surface them without failing.
multiple-versions = "warn"
wildcards = "deny"
# `path = "..."` workspace dependencies have no version requirement.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

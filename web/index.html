<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="See how much of your street home security cameras can see." />
    <title>Observation</title>
    <link data-trunk rel="rust" href="../crates/observation-client/Cargo.toml" data-bin="observation-client" data-cargo-profile="wasm-release" data-wasm-opt="s" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <!-- Coverage worker: started by the app from /coverage-worker_loader.js (trunk names worker output without a hash). -->
    <link data-trunk rel="rust" href="../crates/observation-client/Cargo.toml" data-bin="coverage-worker" data-type="worker" data-bindgen-target="web" data-loader-shim data-cargo-profile="wasm-release" data-wasm-opt="s" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <!-- The --obs-* custom properties and the small-viewport media query, from crates/observation-tokens (written by trunk's pre_build hook; see Trunk.toml). -->
    <link data-trunk rel="inline" href="tokens.css" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: var(--obs-bg);
        color: var(--obs-text);
        font: var(--obs-font-body) / 1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; }
      #observation-canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      .card {
        position: fixed; inset: 0; margin: auto; height: fit-content; max-width: 340px;
        padding: var(--obs-space-xl); background: var(--obs-surface-raised);
        border: 1px solid var(--obs-border); border-radius: var(--obs-radius-lg);
      }
      .card h1 { font-size: var(--obs-font-heading); margin: 0 0 var(--obs-space-sm); }
      .card p { margin: 0; color: var(--obs-text-muted); }
      .bar { margin-top: var(--obs-space-lg); height: 4px; border-radius: 2px; overflow: hidden; background: var(--obs-border); }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--obs-accent); animation: slide 1.2s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="observation-canvas" tabindex="0" aria-label="3D street view"></canvas></div>
    <div id="loader" class="card" role="status">
      <h1>Observation</h1>
      <p>Loading the 3D viewer…</p>
      <div class="bar"></div>
    </div>
    <div id="gate" class="card" role="alert">
      <h1>Larger screen needed</h1>
      <p>Observation is designed for tablets and desktops. Please use a screen or window of at least 768 × 600 pixels.</p>
    </div>
    <noscript><div class="card"><h1>Observation</h1><p>JavaScript and WebAssembly are required.</p></div></noscript>
    <script>
      // Bevy cancels the browser's default action for keys pressed in the canvas
      // (prevent_default_event_handling, which the tablet keyboard needs), and a
      // cancelled Ctrl/Cmd+C, X or V fires no copy, cut or paste event, which is
      // the only way egui's text fields get the clipboard. Keep those three
      // shortcuts away from Bevy so the browser handles them.
      //
      // The tool and panel shortcuts (V P A M R L, F, N, / and F1) do nothing
      // while Ctrl, Cmd or Alt is held, so leave those keys to the browser:
      // Ctrl+R reloads, Ctrl+P prints, Ctrl+F finds. Bevy still gets the key
      // (and egui the text Alt types), but its preventDefault does nothing.
      // Ctrl/Cmd+A stays with the app, where it selects a text field's text.
      // The list must match the client's (a client test checks it).
      const BROWSER_KEYS = ["KeyV", "KeyP", "KeyA", "KeyM", "KeyR", "KeyL", "KeyF", "KeyN", "Slash", "F1"];
      addEventListener("keydown", (e) => {
        const ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && !e.altKey && ["c", "x", "v"].includes(e.key.toLowerCase())) {
          e.stopImmediatePropagation();
        } else if ((ctrl || e.altKey) && BROWSER_KEYS.includes(e.code)
            && !(ctrl && !e.altKey && e.code === "KeyA")) {
          e.preventDefault = () => {};
        }
      }, { capture: true });
    </script>
  </body>
</html>

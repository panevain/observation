<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="See how much of your street home security cameras can see." />
    <title>Observation</title>
    <link data-trunk rel="rust" href="../crates/observation-client/Cargo.toml" data-bin="observation-client" data-cargo-profile="wasm-release" data-wasm-opt="s" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <style>
      /* Mirrors crates/observation-client/src/theme.rs — keep in sync. */
      :root {
        --obs-bg: #f4f5f7;
        --obs-surface: #ffffff;
        --obs-border: #d9dce1;
        --obs-text: #1b1f24;
        --obs-text-muted: #5f6772;
        --obs-accent: #3b5bdb;
        --obs-space-sm: 8px;
        --obs-space-md: 12px;
        --obs-space-lg: 16px;
        --obs-space-xl: 24px;
        --obs-radius-lg: 8px;
        --obs-font-body: 14px;
        --obs-font-heading: 20px;
        --obs-min-width: 768px;
        --obs-min-height: 600px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --obs-bg: #121417;
          --obs-surface: #24282e;
          --obs-border: #333840;
          --obs-text: #e8eaed;
          --obs-text-muted: #9aa2ad;
          --obs-accent: #7c95f2;
        }
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--obs-bg);
        color: var(--obs-text);
        font: var(--obs-font-body) / 1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; }
      #observation-canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      .card {
        position: fixed; inset: 0; margin: auto; height: fit-content; max-width: 340px;
        padding: var(--obs-space-xl); background: var(--obs-surface);
        border: 1px solid var(--obs-border); border-radius: var(--obs-radius-lg);
      }
      .card h1 { font-size: var(--obs-font-heading); margin: 0 0 var(--obs-space-sm); }
      .card p { margin: 0; color: var(--obs-text-muted); }
      .bar { margin-top: var(--obs-space-lg); height: 4px; border-radius: 2px; overflow: hidden; background: var(--obs-border); }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--obs-accent); animation: slide 1.2s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
      #gate { display: none; }
      /* Phones and very small windows: show the gate immediately and hide the app (it still downloads; the app shows the same gate). */
      @media (max-width: 767.98px), (max-height: 599.98px) {
        #gate { display: block; }
        #loader, #app { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="observation-canvas" tabindex="0" aria-label="3D street view"></canvas></div>
    <div id="loader" class="card" role="status">
      <h1>Observation</h1>
      <p>Loading the 3D viewer…</p>
      <div class="bar"></div>
    </div>
    <div id="gate" class="card" role="alert">
      <h1>Larger screen needed</h1>
      <p>Observation is designed for tablets and desktops. Please use a screen or window of at least 768 × 600 pixels.</p>
    </div>
    <noscript><div class="card"><h1>Observation</h1><p>JavaScript and WebAssembly are required.</p></div></noscript>
  </body>
</html>

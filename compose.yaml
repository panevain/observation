# Observation with its optional region agent, for production on one host, and the MCP server
# for AI agents (the `mcp` service, which `up` does not start).
#
#   # set OBS_REGIONS_TOKEN and OBS_ADMIN_TOKEN in fnox.local.toml (see fnox.toml)
#   mise run up            # the released images (OBS_VERSION, default latest), verified
#   mise run up --build    # all three images built from this checkout (tagged :local) instead
#
# Released images are signed and attested (SECURITY.md). `mise run up` checks both against
# Release's signature for OBS_VERSION's tag (scripts/verify-image.sh) and runs them by the
# digest it checked; a patch release reaches a running stack with another `mise run up`.
#
# The variables below come from the environment, and unset ones use the defaults
# here (this file is the only place they are set): `mise run up` loads the tokens
# from fnox.local.toml (gitignored) and OBS_CONTACT from mise.local.toml, and
# passes anything else you set, e.g. `OBS_PORT=9090 mise run up`. Without mise,
# export them before `docker compose up -d --build` (which builds the app and the agent;
# `docker compose --profile mcp build` builds all three). To run the released images without
# mise, set OBS_IMAGE, OBS_REGIONS_IMAGE and OBS_MCP_IMAGE to what
# `scripts/verify-image.sh ghcr.io/panevain/observation:<version>` (and
# `...observation-regions:<version>`, `...observation-mcp:<version>`) print.
#
# The app listens on http://localhost:8080. The region agent has no published
# port: only the app reaches it, over the compose network. Imported regions
# live in the `regions` volume and the bundle/tile cache in `cache`.
#
# Without the agent, run the app alone (`docker run ghcr.io/panevain/observation`);
# everything but local regions works the same.

services:
  observation:
    # `mise run up` sets OBS_IMAGE to the image it verified, pinned by digest.
    image: ${OBS_IMAGE:-ghcr.io/panevain/observation:${OBS_VERSION:-latest}}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      # Host port for the app.
      - "${OBS_PORT:-8080}:8080"
    environment:
      OBS_CONTACT: ${OBS_CONTACT:-}
      OBS_REGIONS_URL: http://regions:8090
      OBS_REGIONS_TOKEN: ${OBS_REGIONS_TOKEN:?set OBS_REGIONS_TOKEN (fnox.local.toml with mise run up, or export it)}
      # Leave empty to make regions read-only in the UI.
      OBS_ADMIN_TOKEN: ${OBS_ADMIN_TOKEN:-}
      # `json` for one JSON object per log line.
      OBS_LOG_FORMAT: ${OBS_LOG_FORMAT:-text}
      # Your reverse proxy's address, if one sits in front, so clients are rate limited apart.
      OBS_TRUSTED_PROXIES: ${OBS_TRUSTED_PROXIES:-}
      # Place search: off unless set (searches then go to that geocoder), e.g.
      # https://nominatim.openstreetmap.org/search under its usage policy.
      OBS_GEOCODER_URL: ${OBS_GEOCODER_URL:-}
      # Your contact for the geocoder's operator, added to its User-Agent.
      OBS_GEOCODER_CONTACT: ${OBS_GEOCODER_CONTACT:-}
    volumes:
      - cache:/var/cache/observation
    depends_on:
      - regions

  regions:
    image: ${OBS_REGIONS_IMAGE:-ghcr.io/panevain/observation-regions:${OBS_VERSION:-latest}}
    build:
      context: .
      target: regions
    restart: unless-stopped
    environment:
      OBS_CONTACT: ${OBS_CONTACT:-}
      OBS_REGIONS_TOKEN: ${OBS_REGIONS_TOKEN:?set OBS_REGIONS_TOKEN (fnox.local.toml with mise run up, or export it)}
      # Largest Geofabrik extract downloaded, MB.
      OBS_REGIONS_MAX_DOWNLOAD_MB: ${OBS_REGIONS_MAX_DOWNLOAD_MB:-2048}
      # Re-import regions after this many days unless a region has its own interval; 0 never (for all).
      OBS_REGIONS_DEFAULT_REFRESH_DAYS: ${OBS_REGIONS_DEFAULT_REFRESH_DAYS:-7}
      # Renamed to OBS_REGIONS_DEFAULT_REFRESH_DAYS; passed on only so the agent refuses an old setting.
      OBS_REGIONS_REFRESH_DAYS: ${OBS_REGIONS_REFRESH_DAYS:-}
      # Range of the interval a region can be given in the UI, days.
      OBS_REGIONS_MIN_REFRESH_DAYS: ${OBS_REGIONS_MIN_REFRESH_DAYS:-7}
      OBS_REGIONS_MAX_REFRESH_DAYS: ${OBS_REGIONS_MAX_REFRESH_DAYS:-365}
      OBS_LOG_FORMAT: ${OBS_LOG_FORMAT:-text}
    volumes:
      - regions:/data

  # The MCP server for AI agents. It speaks MCP over stdio, so an MCP client starts it per
  # session rather than `up` running it: the `mcp` profile keeps it out of `up` and `down`.
  #   docker compose run --rm -T mcp    # -T: no TTY, which would garble the messages
  # `docker compose` needs OBS_REGIONS_TOKEN set even for this (see above); an MCP client can
  # run the image directly instead, with no settings:
  #   docker run --rm -i --network none ghcr.io/panevain/observation-mcp
  # `mise run up` does not check this image; set OBS_MCP_IMAGE to what `mise run verify
  # ghcr.io/panevain/observation-mcp:<version>` prints to run it by a checked digest. It works
  # offline on the demo street and keeps nothing, so it gets no network, a read-only
  # filesystem and no capabilities. The agent bridge (connect_app) needs the app's server
  # on this computer's loopback with OBS_AGENT_BRIDGE=on, which this stack's published port
  # does not give (the server sees the Docker network's address, not loopback): run the
  # server on the host and this image with `docker run --rm -i --network host` instead (see
  # the README).
  mcp:
    image: ${OBS_MCP_IMAGE:-ghcr.io/panevain/observation-mcp:${OBS_VERSION:-latest}}
    build:
      context: .
      target: mcp
    profiles: [mcp]
    stdin_open: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Logs go to stderr, which MCP clients show; stdout carries the messages.
      RUST_LOG: ${OBS_MCP_LOG:-warn}

  # The same MCP server over Streamable HTTP, for MCP clients that connect to a URL rather than
  # start a process. Every request needs `Authorization: Bearer <secret>` for one of the
  # name:secret pairs in OBS_MCP_TOKENS (comma-separated; secrets of at least 32 characters, e.g.
  # `openssl rand -base64 32`), which reach the server as a Compose secret, not an environment
  # variable that `docker inspect` would show:
  #   OBS_MCP_TOKENS="laptop:$(openssl rand -base64 32)" docker compose --profile mcp-http up -d mcp-http
  # The endpoint is http://localhost:${OBS_MCP_PORT:-8090}/mcp, on loopback only: it speaks
  # plain HTTP, so to serve other computers put a TLS-terminating proxy in front and set
  # OBS_MCP_ALLOWED_HOSTS to the name clients use. Browser origins are refused unless listed in
  # OBS_MCP_ALLOWED_ORIGINS, which the server then answers CORS for (for llama.cpp's chat page
  # on llama-server's default port: http://localhost:8080,http://127.0.0.1:8080). It reaches nothing, but has a network for its port, so the agent
  # bridge (connect_app) is out of reach here as in the `mcp` service. See docs/design.md.
  mcp-http:
    image: ${OBS_MCP_IMAGE:-ghcr.io/panevain/observation-mcp:${OBS_VERSION:-latest}}
    build:
      context: .
      target: mcp
    profiles: [mcp-http]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OBS_MCP_PORT:-8090}:8090"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets:
      - source: mcp_tokens
        target: mcp_tokens
    environment:
      OBS_MCP_LISTEN: 0.0.0.0:8090
      OBS_MCP_TOKENS_FILE: /run/secrets/mcp_tokens
      OBS_MCP_ALLOWED_HOSTS: ${OBS_MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      OBS_MCP_ALLOWED_ORIGINS: ${OBS_MCP_ALLOWED_ORIGINS:-}
      # rmcp logs every request at info.
      RUST_LOG: ${OBS_MCP_LOG:-info,rmcp=warn}

secrets:
  # The mcp-http service's tokens: OBS_MCP_TOKENS's value, as the file it reads (pairs
  # separated by commas or new lines).
  mcp_tokens:
    environment: OBS_MCP_TOKENS

volumes:
  cache:
  regions:

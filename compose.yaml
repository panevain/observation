# Observation with its optional region agent, for production on one host.
#
#   # set OBS_REGIONS_TOKEN and OBS_ADMIN_TOKEN in fnox.local.toml (see fnox.toml)
#   mise run up            # the released images (OBS_VERSION, default latest), verified
#   mise run up --build    # both images built from this checkout instead
#
# Released images are signed and attested (SECURITY.md). `mise run up` checks both against
# Release's signature for OBS_VERSION's tag (scripts/verify-image.sh) and runs them by the
# digest it checked; a patch release reaches a running stack with another `mise run up`.
#
# The variables below come from the environment: `mise run up` loads the tokens
# from fnox.local.toml (gitignored), the other settings from its task env in
# mise.toml and OBS_CONTACT from mise.local.toml. Without mise, export them
# before `docker compose up -d --build`; unset ones use the defaults here. To run
# the released images without mise, set OBS_IMAGE and OBS_REGIONS_IMAGE to what
# `scripts/verify-image.sh ghcr.io/panevain/observation:<version>` (and
# `...observation-regions:<version>`) print.
#
# The app listens on http://localhost:8080. The region agent has no published
# port: only the app reaches it, over the compose network. Imported regions
# live in the `regions` volume and the bundle/tile cache in `cache`.
#
# Without the agent, run the app alone (`docker run ghcr.io/panevain/observation`);
# everything but local regions works the same.

services:
  observation:
    # `mise run up` sets OBS_IMAGE to the image it verified, pinned by digest.
    image: ${OBS_IMAGE:-ghcr.io/panevain/observation:${OBS_VERSION:-latest}}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "${OBS_PORT:-8080}:8080"
    environment:
      OBS_CONTACT: ${OBS_CONTACT:-}
      OBS_REGIONS_URL: http://regions:8090
      OBS_REGIONS_TOKEN: ${OBS_REGIONS_TOKEN:?set OBS_REGIONS_TOKEN (fnox.local.toml with mise run up, or export it)}
      # Leave empty to make regions read-only in the UI.
      OBS_ADMIN_TOKEN: ${OBS_ADMIN_TOKEN:-}
      OBS_LOG_FORMAT: ${OBS_LOG_FORMAT:-text}
    volumes:
      - cache:/var/cache/observation
    depends_on:
      - regions

  regions:
    image: ${OBS_REGIONS_IMAGE:-ghcr.io/panevain/observation-regions:${OBS_VERSION:-latest}}
    build:
      context: .
      target: regions
    restart: unless-stopped
    environment:
      OBS_CONTACT: ${OBS_CONTACT:-}
      OBS_REGIONS_TOKEN: ${OBS_REGIONS_TOKEN:?set OBS_REGIONS_TOKEN (fnox.local.toml with mise run up, or export it)}
      OBS_REGIONS_MAX_DOWNLOAD_MB: ${OBS_REGIONS_MAX_DOWNLOAD_MB:-2048}
      OBS_REGIONS_DEFAULT_REFRESH_DAYS: ${OBS_REGIONS_DEFAULT_REFRESH_DAYS:-7}
      # Renamed to OBS_REGIONS_DEFAULT_REFRESH_DAYS; passed on only so the agent refuses an old setting.
      OBS_REGIONS_REFRESH_DAYS: ${OBS_REGIONS_REFRESH_DAYS:-}
      OBS_REGIONS_MIN_REFRESH_DAYS: ${OBS_REGIONS_MIN_REFRESH_DAYS:-7}
      OBS_REGIONS_MAX_REFRESH_DAYS: ${OBS_REGIONS_MAX_REFRESH_DAYS:-365}
      OBS_LOG_FORMAT: ${OBS_LOG_FORMAT:-text}
    volumes:
      - regions:/data

volumes:
  cache:
  regions:

[package]
name = "observation-upstream"
description = "Guards for the server's outbound HTTP: address filtering, redirect policy, URL checks, the HTTP port and its guarded client, body caps, waiting queues"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Fakes for tests of the crates that use the HTTP port.
testing = ["dep:http-body", "dep:http-body-util", "dep:tower"]

[dependencies]
bytes = "1"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
reqwest.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
tower = { workspace = true, optional = true, features = ["util"] }

[dev-dependencies]
http-body = "1"
http-body-util = "0.1"
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

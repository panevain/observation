[package]
name = "observation-regions"
description = "Region agent for Observation: imports Geofabrik extracts into local Overpass databases and queries them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
observation-core.workspace = true
observation-upstream.workspace = true
observation-regions-api.workspace = true
axum.workspace = true
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
tokio = { workspace = true, features = ["process", "io-util"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
observation-upstream = { workspace = true, features = ["testing"] }
tempfile = "3"
# Paused time for the download client's connect-timeout probe and the
# registry's publication throttle.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package]
name = "observation-core"
description = "Shared geometry, camera and coverage logic for Observation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
thiserror.workspace = true
earcut.workspace = true
ron.workspace = true

[features]
# Fixture builders (`observation_core::testing`) for tests. Enable it only
# from `[dev-dependencies]`, never from `[dependencies]`.
testing = []

[dev-dependencies]
# This crate's own integration tests use the fixture builders.
observation-core = { path = ".", features = ["testing"] }
proptest.workspace = true

[lints]
workspace = true

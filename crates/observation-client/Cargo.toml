[package]
name = "observation-client"
description = "Bevy/WASM front-end for Observation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
observation-core.workspace = true
serde.workspace = true
serde_json.workspace = true
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_picking",
    "mesh_picking",
    "png",
    "mouse",
    "keyboard",
    "touch",
    "webgl2",
] }
bevy_egui = { workspace = true, features = [
    "render",
    "default_fonts",
    "open_url",
] }
crossbeam-channel = "0.5"
egui-phosphor = { version = "0.14", default-features = false, features = [
    "regular",
    "fill",
    "subset",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web"] }
bevy_egui = { workspace = true, features = ["manage_clipboard"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Storage",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "File",
    "FileList",
    "FileReader",
    "Event",
    "EventSource",
    "MessageEvent",
    "Response",
    "Request",
    "RequestInit",
    "Headers",
    "Location",
    "CssStyleDeclaration",
    "MediaQueryList",
] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["x11"] }

[lints]
workspace = true

[package]
name = "observation-server"
description = "Bundle server for Observation: OSM building bundles, tile proxy, static client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test doubles (a manual clock, memory stores, the app over fakes) for tests of
# code that builds on this crate.
testing = ["observation-regions-api/testing", "observation-upstream/testing"]

[dependencies]
observation-core.workspace = true
observation-upstream.workspace = true
observation-regions-api.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
httpdate = "1.0"
# Decodes the Terrarium elevation tiles areas are built on.
png = "0.18"

[dev-dependencies]
# The integration tests build the app over fakes (`testing::TestApp`).
observation-server = { path = ".", features = ["testing"] }
observation-regions-api = { workspace = true, features = ["testing"] }
observation-upstream = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
tempfile = "3"

[lints]
workspace = true
